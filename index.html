<!-- 블록제 통합 스터디 워크스페이스 · 멀티블록 v2 -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#F5F7FA; --surface:#FFFFFF; --surface2:#EEF1F5; --ink:#1C2430; --muted:#7C8798; --faint:#A7AFBD;
    --line:#E2E6ED;
    --accent:#2F6FED; --accent-soft:#EAF0FE;
    --idle:#1C2430;
    --progress:#2F6FED; --progress-soft:#EAF0FE;
    --done:#2F6FED; --done-soft:#97b0fc;
    --inactive:#565F6E; --inactive-soft:#D8DCE4;
    --warn:#002057; --warn-soft:#FBDDEA;
    --disp:'Pretendard',-apple-system,'Segoe UI','Noto Sans KR',sans-serif;
    --sans:'Pretendard',-apple-system,'Segoe UI','Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;padding:20px 16px 70px}
  .wrap{max-width:1080px;margin:0 auto}

  .blocktabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .blocktab{padding:8px 15px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
  .blocktab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .blocktab.add{background:var(--surface);border:1px dashed var(--faint);color:var(--muted)}
  .blocktab.add:hover{color:var(--accent);border-color:var(--accent)}
  .blocktabgrp{display:inline-flex;align-items:center;gap:2px}
  .tabdel{width:18px;height:18px;border:none;border-radius:50%;background:transparent;color:var(--faint);font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .tabdel:hover{background:var(--warn-soft);color:var(--warn)}
  .tabedit{width:34px;height:24px;border:none;border-radius:7px;background:transparent;color:var(--faint);font-size:11px;line-height:1;white-space:nowrap;cursor:pointer;padding:0 5px}
  .tabedit:hover{background:var(--accent-soft);color:var(--accent)}

  header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:6px 2px 18px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .dot{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:18px;line-height:1;flex-shrink:0;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .brand .dot:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .emoji-picker-wrap{position:relative;flex-shrink:0}
  .emoji-picker{position:absolute;top:40px;left:0;z-index:20;display:none;grid-template-columns:repeat(6,32px);gap:5px;max-height:70vh;overflow-y:auto;padding:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px rgba(28,36,48,.14)}
  .emoji-picker.on{display:grid}
  .emoji-choice{width:32px;height:32px;border:1px solid transparent;border-radius:7px;background:transparent;font-size:19px;line-height:1;cursor:pointer;padding:0}
  .emoji-choice:hover{background:var(--accent-soft);border-color:var(--accent)}
  .brand h1{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:-0.3px;margin:0;color:var(--ink)}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .ctrls{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);cursor:pointer;font-size:15px;color:var(--muted);background:var(--surface)}
  .stepper button:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .readout{text-align:center;min-width:70px}
  .readout .n{font-size:10px;font-weight:700;color:var(--faint)}
  .readout .d{font-size:14px;font-weight:800;color:var(--ink)}
  .capl{font-size:10px;font-weight:700;color:var(--faint);margin-bottom:3px}

  .gaugebar{
    position:relative;overflow:hidden;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:6px 0 16px;padding:16px 20px;border-radius:12px;
    background:var(--surface); border:1px solid var(--line);
  }
  .gaugebar svg{flex-shrink:0}
  .gaugebar .msg{font-family:var(--disp);font-weight:800;font-size:14px;color:var(--ink);flex:1;min-width:180px;line-height:1.5}
  .gaugebar .dnum{font-family:var(--disp);font-weight:800;font-size:24px;color:var(--ink)}
  .gaugebar .msg small{display:block;font-family:var(--sans);font-weight:600;font-size:12px;color:var(--muted);margin-top:3px}
  .clover{position:absolute;font-size:15px;top:-18px;animation:fall 3.2s linear infinite}
  @keyframes fall{ to{ transform:translateY(80px) rotate(200deg); opacity:0; } }

  .tabs{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
  .tab{padding:9px 15px;border-radius:9px;border:1px solid transparent;background:var(--surface2);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
  .tab.on{background:var(--ink);color:#fff}
  .panelset{display:none}
  .panelset.on{display:block}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:14px 0}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat .k{font-size:10.5px;color:var(--muted)}
  .stat .v{font-family:var(--disp);font-size:19px;font-weight:800;margin-top:4px;color:var(--ink)}

  .stagegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
  @media(max-width:720px){.stagegrid{grid-template-columns:1fr}}
  .stagecol{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;border-left:4px solid var(--line)}
  .stagecol:nth-child(1){border-left-color:var(--progress)}
  .stagecol:nth-child(2){border-left-color:var(--done)}
  .stagecol:nth-child(3){border-left-color:var(--inactive)}
  .stagecol h2{font-family:var(--disp);font-weight:800;font-size:13px;margin:0 0 2px;display:flex;align-items:center;gap:6px;color:var(--ink)}
  .stagecol .n{font-size:10.5px;background:var(--bg);color:var(--muted);border-radius:20px;padding:1px 8px;font-weight:700}
  .stagecol .desc{font-size:11px;color:var(--muted);margin:0 0 10px;line-height:1.45}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
  .panel h2{font-family:var(--disp);font-weight:800;font-size:13px;margin:0 0 3px;color:var(--ink)}
  .panel .hint{font-size:11px;color:var(--muted);margin:0 0 9px}
  .card{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);margin-bottom:8px}
  .card .top{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:3px}
  .code{font-size:10.5px;font-weight:700;color:var(--muted)}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
  .badge.lab{background:var(--bg);color:var(--muted)}
  .badge.carry{background:var(--warn-soft);color:var(--warn)}
  .badge.due{background:var(--progress-soft);color:var(--progress)}
  .badge.late{background:var(--warn-soft);color:var(--warn)}
  .card .t{font-size:13px;font-weight:800}
  .card .m{font-size:10.5px;color:var(--muted);margin-top:2px}
  .go{margin-top:8px;border:none;border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
  .go.amber{background:var(--done);color:var(--ink)}
  .empty{font-size:12px;color:var(--faint);text-align:center;padding:18px 4px}

  details.pre{margin-top:6px}
  details.pre summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}

  .listbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:18px;overflow:hidden}
  .lh{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  .lh h2{margin:0;font-size:13px;font-family:var(--disp);font-weight:800}
  .reset{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:7px 13px;font-size:11.5px;font-weight:700;cursor:pointer}
  .reset:hover{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-soft)}
  .daygrp{border-top:1px solid var(--line)}
  .dayhd{padding:9px 16px;font-size:11.5px;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:baseline}
  .dayhd .ex{color:var(--ink)}
  .row{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .row .rt{flex:1;min-width:160px}
  .row .rt .rn{font-size:13px;font-weight:700}
  .row .rt .rp{font-size:11px;color:var(--muted)}
  .chips{display:flex;gap:4px}
  .chip{display:flex;flex-direction:column;align-items:center;gap:1px;width:28px}
  .chip button, .chip span.sq{width:19px;height:19px;border-radius:6px;border:none;cursor:pointer;background:var(--inactive-soft);font-size:8.5px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--inactive)}
  .chip button.done{background:var(--done);color:var(--ink)}
  .chip button.due{background:var(--progress);color:#fff}
  .chip button.overdue{background:var(--warn);color:#fff}
  .chip span.sq.na{background:repeating-linear-gradient(45deg,var(--line) 0 2px,var(--surface) 2px 4px);cursor:default}
  .chip span.sq.inactive{cursor:default;opacity:.6}
  .chip .lbl{font-size:8.5px;color:var(--faint)}
  .encpill{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--bg);padding:2px 9px;border-radius:20px}
  .encpill.no{color:var(--faint);background:var(--bg)}
  .undo{border:none;background:transparent;color:var(--faint);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline}
  .undo:hover{color:var(--warn)}

  .addlec{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface2)}
  .addlec input, .addlec select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11.5px;font-family:var(--sans);background:var(--surface)}
  .addlec input[type=text]{width:110px}
  .addlec button{border:none;border-radius:9px;padding:8px 14px;font-size:11.5px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}

  .plib{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:720px){.plib{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;position:relative}
  .pcard .ptitle{font-family:var(--disp);font-weight:800;font-size:13px;margin-bottom:2px;color:var(--ink)}
  .pcard .pwhen{font-size:10.5px;color:var(--muted);margin-bottom:8px}
  .pcard .ptext{font-size:11px;color:var(--muted);white-space:pre-wrap;line-height:1.55}
  .copybtn{margin-top:9px;border:none;color:var(--accent);background:var(--accent-soft);border-radius:9px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer}
  .copybtn.copied{background:var(--accent);color:#fff}
  .instruction-card{grid-column:1/-1}
  .instruction-body{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .instruction-body.on{display:block}
  .instruction-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .instruction-toggle{margin-top:9px;border:none;color:var(--ink);background:var(--surface2);border-radius:9px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer}
  .review-label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .review-input{width:100%;min-height:100px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:11.5px/1.55 var(--sans);color:var(--ink);background:var(--surface)}
  .instruction-preview{margin-top:10px;max-height:300px;overflow:auto;padding:10px;background:var(--surface2);border-radius:9px;font-size:10.5px;color:var(--muted);white-space:pre-wrap}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:9px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  .toast.show{opacity:1}

  .mask{position:fixed;inset:0;background:rgba(28,36,48,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .mask.on{display:flex}
  .modal{background:var(--surface);border-radius:14px;max-width:360px;width:100%;padding:20px;max-height:88vh;overflow:auto;border:1px solid var(--line)}
  .modal.wide{max-width:420px}
  .modal h3{margin:0 0 6px;font-size:15px;font-family:var(--disp);font-weight:800;letter-spacing:-0.3px}
  .modal p{margin:0;font-size:12px;color:var(--muted);white-space:pre-line;line-height:1.55}
  .modal .acts{margin-top:16px;display:flex;justify-content:flex-end;gap:8px}
  .modal button{border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:700;cursor:pointer;border:none}
  .modal .no{background:var(--surface2);color:var(--muted)}
  .modal .yes{background:var(--warn);color:#fff}

  .form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
  .form-row label{font-size:11.5px;font-weight:700;color:var(--muted)}
  .form-row input[type=text],.form-row input[type=date]{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;font-family:var(--sans)}
  .form-row input[type=file]{font-size:11.5px}
  .nbstatus{font-size:11.5px;color:var(--muted);white-space:pre-wrap;margin-top:6px;min-height:14px}
  .primary{background:var(--accent)!important;color:#fff!important}

  .planlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .planrow{display:grid;grid-template-columns:64px 1fr 150px;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
  .planrow.cur{border-color:var(--accent);background:var(--accent-soft)}
  .planrow.past{opacity:.5}
  .pd{font-size:11px;font-weight:800;color:var(--ink);line-height:1.3}
  .pdate{font-size:10px;font-weight:600;color:var(--muted)}
  .pbarwrap{position:relative;height:14px;background:var(--surface2);border-radius:7px}
  .pbar{height:100%;border-radius:7px;transition:width .2s}
  .pcapline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
  .pcount{font-size:10.5px;color:var(--muted);white-space:nowrap;text-align:right}
  .pnote{font-size:9.5px;color:var(--muted);font-weight:700;grid-column:1/-1;margin-top:-2px}
  .capinput{width:56px;font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;margin-left:6px;font-family:var(--sans)}
  .typecosts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;background:var(--surface2);border-radius:9px}
  .typecosts .tclbl{font-size:10.5px;font-weight:700;color:var(--muted)}
  .typecosts label{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--ink)}
  .tcinput{width:54px;font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;font-family:var(--sans)}
  .pbar2{position:relative;height:100%;display:flex;border-radius:7px;overflow:hidden}
  .pbarseg{height:100%}
  .plantags{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .plantaggrp{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .plantaggrp .glbl{font-size:9px;font-weight:700;color:var(--faint);min-width:24px}
  .plantag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px}
  .plantag.new{background:var(--progress-soft);color:var(--progress)}
  .plantag.r1{background:var(--done-soft);color:var(--ink)}
  .plantag.r2{background:var(--inactive-soft);color:var(--inactive)}
  .plantag.done{opacity:.5}

  .battery-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .battery{position:relative;width:72px;height:32px;border:2px solid var(--line);border-radius:7px;padding:3px;flex-shrink:0;background:var(--surface2)}
  .battery::after{content:'';position:absolute;right:-7px;top:10px;width:5px;height:12px;background:var(--line);border-radius:0 3px 3px 0}
  .battery-fill{height:100%;border-radius:3px;transition:width .3s ease}
  .battery-pct{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-0.3px}

  .onboard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .onboard summary{cursor:pointer;font-weight:800;font-size:13px;font-family:var(--disp);list-style:none;color:var(--ink)}
  .onboard summary::-webkit-details-marker{display:none}
  .oitem{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
  .oitem:first-of-type{border-top:none;padding-top:12px}
  .ochk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
  .ochk.done{background:var(--done);border-color:var(--done);color:var(--ink)}
  .olabel{flex:1;font-size:12px;font-weight:600}
  .olabel.done{color:var(--muted)}
  .olabel.later{color:var(--muted);font-style:italic}
  .olater-badge{font-size:9.5px;font-weight:700;color:var(--inactive);background:var(--inactive-soft);padding:1px 7px;border-radius:20px;margin-left:6px}
  .olaterbtn{border:none;background:transparent;color:var(--faint);font-size:10.5px;font-weight:700;cursor:pointer;text-decoration:underline;flex-shrink:0}
  .opromptbtn{border:none;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;cursor:pointer;border-radius:7px;padding:3px 8px;flex-shrink:0}
  .opromptbox{margin:6px 0 0 26px;padding:9px 11px;background:var(--surface2);border-radius:9px;font-size:10.5px;color:var(--muted);white-space:pre-wrap}

  .dayflow{display:flex;flex-direction:column;gap:10px;margin:16px 0}
  .flowitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .flowhead{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer}
  .flowbadge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:8px;flex-shrink:0}
  .flowbadge.new{background:var(--progress-soft);color:var(--progress)}
  .flowbadge.r1{background:var(--done-soft);color:var(--ink)}
  .flowbadge.r2{background:var(--inactive-soft);color:var(--inactive)}
  .flowtitle{flex:1;font-size:13px;font-weight:700;min-width:0}
  .flowmeta{font-size:10.5px;color:var(--muted);display:block;font-weight:400}
  .flowdone{border:none;border-radius:9px;padding:7px 13px;font-size:11.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;flex-shrink:0}
  .flowdone.done{color:var(--ink)}
  .flowbody{display:none;padding:2px 14px 12px 14px;border-top:1px solid var(--line)}
  .substep{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:11.5px}
  .substep .schk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;background:var(--surface)}
  .substep .schk.done{background:var(--done);border-color:var(--done);color:var(--ink)}
  .substep .slabel{flex:1}
  .substep .slabel.done{color:var(--faint)}

  .eeve{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
  .eeve h2{font-family:var(--disp);font-weight:800;font-size:14px;margin:0 0 8px}
  .compareCard{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:11.5px}

  .emptystate{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:36px 20px;text-align:center}
  .emptystate button{margin-top:12px;border:none;border-radius:9px;padding:10px 18px;font-size:12.5px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
</style>

<div class="wrap">
  <div class="blocktabs" id="blockTabs"></div>

  <div id="emptyState" class="emptystate" style="display:none">

2. 무생략: 세부 수치·분류·기전·예외까지 전부 포함해.
3. 직관적 비유: 눈에 안 보이는 기전은 일상 사물·현상에 적극적으로 비유해서 설명해.
영어 전공용어는 최소화하고, 꼭 필요한 경우(고유명사, 표준 약어 등)가 아니면 한국어로
풀어서 설명해.
4. 형식: 핵심 용어는 굵게. 분류·감별·특성 비교는 표로, 병태·기전·신호전달은 인과사슬
(원인→기전→결과)로. 줄글 최소화. 강의록의 그림·사진이 꼭 필요한 부분은 실제 이미지를
넣지 말고 정리본 형식 규칙에 정한 캡션 형식으로 자리만 표시해. 불필요한 사진은 최소화해.
5. 챕터 단위: 강의록 전체를 한 번에 쏟지 말고 대단원/주제별로 끊어서 설명해. 시작 전
대단원 목차와 우선순위(상/중/하)를 표로 보여주고 확인받은 뒤 진행해.
6. 챕터 시작 시 "이 강의 전체 흐름"을 1~2줄로 먼저 상기시켜줘.
7. 챕터 설명이 끝나면 미니 인출 전에 3~5줄짜리 "이번 챕터 요약 체크리스트"를 먼저
보여줘. 순서: 설명 → 요약 체크리스트 → 미니 인출.
8. 필기에 "외우지 마라"·"암기 불필요"류 문구가 있으면 내용 옆에 반드시 "(암기 불필요)"라고
표시하고 Anki 카드 대상에서 제외해. "시험에 낸다"·"외워라"·"중요"는 굵게 표시하고 강조해.

### 인출
9. 각 챕터 요약 체크리스트 다음, 강의록 안 보고 답할 미니 인출 문제 2~3개를 중요·강조된
부분에서 출제해. 내가 답하기 전엔 정답을 공개하지 마. 채점하고, 틀리면 그 부분만 인과사슬로
다시 설명한 뒤 재출제해.
10. 강의 전체가 끝나면 챕터들을 요약해서 전체 흐름을 다시 짚어줘.
11. 이후 교수의 출제 형식·족보 스타일에 맞춰 능동 인출 문제 8~10개를 내. 채점 후 틀린 것만
다시 인과사슬로 설명해.
12. 문제는 단답식·객관식 위주로 내고, 여러 단계 기전의 이해 확인에만 서술형을 사용해.
13. 반드시 족보를 분석해 실제 출제 방식과 형태를 반영해. 강의록 번호를 그대로 묻는 얕은
문제는 만들지 마.

24. 반드시 .apkg 파일로 제공해.

/* ===== 부하균형 인출 알고리즘 (실시간 재계산) =====
   각 강의는 시험기간 동안 총 3회독: 신규 → 1차 → 2차. 각 단계의 크레딧(기본 1 / 0.5 /
   0.25)은 "학습 계획" 탭 상단에서 직접 바꿀 수 있다.
   남은 크레딧(= 아직 안 끝난 항목들의 가중치 합) ÷ 남은 분배 일수(오늘부터, 시험 전날·
   당일 제외)가 하루 목표 크레딧의 기준이다. 다만 시험기간 전체의 초반 20%는 목표를
   70%로 낮춰 적응 기간을 두고, 그만큼을 나머지 날짜에 나눠 보정한다(총량은 항상
   보존됨) — 오늘이 이미 그 구간을 지났으면 자동으로 평소(100%) 기준이 적용된다.
   이미 완료한 항목(인코딩·체크 완료)은 계산에서 완전히 빠지고, 오늘부터 남은 것만
   매번 새로 계산한다.

   하루하루를 앞에서부터 시뮬레이션한다. 각 강의의 기본값(목표)은 항상 실제 수업일
   기준으로 고정된다 — 신규=수업일, 1차=수업일+1, 2차=수업일+3. 이 기본값들이 그날그날
   들쭉날쭉 몰리므로, 그날 목표 크레딧에 순서대로 채우다가 넘치면 다음 날로 미루고
   (이월), 오늘 다 채우고도 여유가 남으면 아직 도래하지 않은 항목을 앞당겨 채운다(예습).
   단, 복습은 그 강의의 신규(1차는 신규, 2차는 1차)가 실제로 배정되기 전까지는 배정될 수
   없다 — 신규가 밀리면 그 복습의 목표일도 "기본값과 (실제 신규일+1) 중 더 늦은 날"로
   자동 조정되고, 반대로 신규가 일찍 끝나도 복습은 원래 기본값(수업일+1/+3)보다 앞당겨
   지지 않는다. 이렇게 신규→1차→2차 세 단계가 항상 순서를 지키면서 시험기간 안에 전부
   확정 배정된다.

   하루 목표 크레딧은 각 날짜별로 직접 상향·하향 조정할 수 있다(약속 있는 날은 낮추고,
   몰아서 할 수 있는 날은 올리는 식) — 그러면 다음 계산부터 바로 반영된다. */
function activeLectures(){ return LEC.filter(l=>!S.lec[l.id].excluded); }
function usableDays(){ return Math.max(1, S.examDay-2); } // 시험 당일·전날은 분배 제외
const DEFAULT_TYPE_COST = {new:1, r1:0.5, r2:0.25};
function typeCost(type){ return (S.typeCost && S.typeCost[type]!=null) ? S.typeCost[type] : DEFAULT_TYPE_COST[type]; }
function totalLecCost(){ return typeCost('new')+typeCost('r1')+typeCost('r2'); }
function remainingCredits(){
  let sum=0;
  activeLectures().forEach(l=>{
    const st=S.lec[l.id];
    if(st.enc==null) sum+=totalLecCost();
    else sum += (st.r[1]?0:typeCost('r1')) + (st.r[2]?0:typeCost('r2'));
  });
  return sum;
}
function rampDays(){ return Math.max(1, Math.ceil(0.2*usableDays())); }
function dayWeight(d){ return d<=rampDays() ? 0.7 : 1.0; }
/* remainingCred를 fromDay~시험 전날 사이에, 초반 램프 가중치를 반영해서 나눈 값 중
   day d의 몫. 총합은 항상 remainingCred로 보존된다. */
function defaultCapacityFor(d, remainingCred, fromDay){
  const uEnd=usableDays();
  let wsum=0;
  for(let x=fromDay; x<=uEnd; x++) wsum+=dayWeight(x);
  if(wsum<=0) wsum=1;
  return (remainingCred/wsum)*dayWeight(d);
}
/* 오늘 크레딧은 "코인"이다 — 하루가 시작될 때 한 번 정해지면 그날 안에서는 바뀌지
   않는다. 체크(완료)를 해서 코인을 쓰는 것과, 새로 코인이 배정되는 것(=오늘 할 일
   목록이 다시 계산되는 것)은 완전히 별개다. S.todayLock에 "오늘 하기로 확정된 목록"을
   저장해두고, 날짜가 바뀌거나(다음 날로 이동) 시험일·크레딧 상향/하향 조정·시험범위
   제외 같은 "계획 자체를 바꾸는" 조작이 있을 때만 다시 정한다. 단순히 항목을
   완료 체크하는 것으로는 절대 다시 계산되지 않는다.
   재계산이 일어날 때는(예: 크레딧 조정) 오늘 이미 완료한 항목을 "이미 쓴 크레딧"으로
   그대로 포함시키고 남은 예산만 새로 채운다 — 그래서 오늘 1을 이미 했으면 그만큼은
   다른 날과 동일하게가 아니라 정확히 1만큼 덜 배정된다. */
function lockedTodayTotalCost(){
  if(!S.todayLock || S.todayLock.day!==S.cur) return 0;
  return S.todayLock.items.reduce((a,it)=>a+typeCost(it.type),0);
}
function lockedTodayDoneCost(){
  if(!S.todayLock || S.todayLock.day!==S.cur) return 0;
  let sum=0;
  S.todayLock.items.forEach(it=>{
    const st=S.lec[it.lecId]; if(!st) return;
    let done;
    if(it.type==='new') done = st.enc!=null;
    else if(it.type==='r1') done = !!st.r[1];
    else done = !!st.r[2];
    if(done) sum+=typeCost(it.type);
  });
  return sum;
}
function lockedTodayRemainingCost(){ return Math.max(0, lockedTodayTotalCost()-lockedTodayDoneCost()); }
function futureRemainingCredits(){ return Math.max(0, remainingCredits()-lockedTodayRemainingCost()); }
function dayCapacity(d){
  const uEnd = usableDays();
  if(d<1 || d>uEnd) return 0; // 시험 전날·당일: 분배 대상 아님
  if(S.capOverride && S.capOverride[d]!=null) return S.capOverride[d];
  if(d===S.cur) return (S.todayLock && S.todayLock.day===S.cur) ? lockedTodayTotalCost() : defaultCapacityFor(d, remainingCredits(), S.cur);
  return defaultCapacityFor(d, futureRemainingCredits(), S.cur+1);
}
function buildPendingPool(excludeKeys){
  const pool=[];
  activeLectures().forEach(l=>{
    const st=S.lec[l.id];
    const push=(type,original)=>{ if(excludeKeys && excludeKeys.has(l.id+':'+type)) return; pool.push({type, lecId:l.id, cost:typeCost(type), original, nominal:original}); };
    if(st.enc==null){ push('new',l.day); push('r1',l.day+1); push('r2',l.day+3); }
    else {
      if(!st.r[1]){ push('r1',st.enc+1); if(!st.r[2]) push('r2',st.enc+3); }
      else if(!st.r[2]){ push('r2',st.enc+3); }
    }
  });
  return pool;
}
const TYPE_ORDER={new:0,r1:1,r2:2};
const scheduleSortFn=(a,b)=> a.nominal-b.nominal || TYPE_ORDER[a.type]-TYPE_ORDER[b.type] || a.lecId-b.lecId;
/* 그날 목표 크레딧(cap)이 남아 있는 한(used<cap) 다음 항목을 마저 진행한다 — 정확히
   맞아떨어지지 않아 살짝 넘어가도 OK. 여유가 완전히 없어지면(used>=cap) 그 시점에서
   멈추고 나머지는 전부 다음 날로 이월한다. */
function fillDay(pool, cap){
  pool.sort(scheduleSortFn);
  const placed=[]; let used=0; let i=0;
  for(; i<pool.length; i++){
    if(used >= cap-1e-9) break;
    placed.push(pool[i]); used+=pool[i].cost;
  }
  return {placed, rest:pool.slice(i)};
}
function ensureTodayLock(){
  if(S.todayLock && S.todayLock.day===S.cur) return;
  const uEnd = usableDays();
  if(S.cur<1 || S.cur>uEnd){ S.todayLock = {day:S.cur, items:[]}; return; } // 시험 전날·당일 등 분배 대상 밖
  const pinned=[];
  activeLectures().forEach(l=>{
    const st=S.lec[l.id];
    if(st.enc===S.cur) pinned.push({type:'new', lecId:l.id, original:l.day});
    if(st.r[1] && st.rDay && st.rDay[1]===S.cur) pinned.push({type:'r1', lecId:l.id, original:(st.enc!=null?st.enc+1:l.day+1)});
    if(st.r[2] && st.rDay && st.rDay[2]===S.cur) pinned.push({type:'r2', lecId:l.id, original:(st.enc!=null?st.enc+3:l.day+3)});
  });
  const pinnedCost = pinned.reduce((a,it)=>a+typeCost(it.type),0);
  const cap = (S.capOverride && S.capOverride[S.cur]!=null) ? S.capOverride[S.cur] : defaultCapacityFor(S.cur, remainingCredits()+pinnedCost, S.cur);
  const pool = buildPendingPool(null);
  const {placed} = fillDay(pool, Math.max(0, cap-pinnedCost));
  S.todayLock = {day:S.cur, items: [...pinned, ...placed].map(it=>({type:it.type, lecId:it.lecId, original:it.original}))};
}
/* 오늘 몫은 S.todayLock을 그대로 쓰고(체크할수록 줄기만 함), 내일부터 시험 전날까지는
   오늘 lock에 들어간 것들을 제외한 나머지로 매번 새로 시뮬레이션한다(이월·예습 반영,
   실제 상태는 건드리지 않는 순수 계산). */
function computeSchedule(){
  ensureTodayLock();
  const uEnd = usableDays(), startDay = S.cur;
  const byDay={}; for(let d=startDay; d<=uEnd; d++) byDay[d]=[];
  if(!byDay[startDay]) byDay[startDay]=[]; // 오늘이 분배 구간 밖이어도(시험 전날 등) 항상 키는 존재하게

  const lockedKeys = new Set();
  S.todayLock.items.forEach(it=>{
    lockedKeys.add(it.lecId+':'+it.type);
    const st=S.lec[it.lecId]; if(!st) return;
    let done;
    if(it.type==='new') done = st.enc!=null;
    else if(it.type==='r1') done = !!st.r[1];
    else done = !!st.r[2];
    byDay[startDay].push({type:it.type, lecId:it.lecId, cost:typeCost(it.type), original:it.original, day:startDay, done});
  });

  let pool = buildPendingPool(lockedKeys);
  for(let d=startDay+1; d<=uEnd; d++){
    const {placed, rest} = fillDay(pool, dayCapacity(d));
    placed.forEach(it=>{ it.day=d; byDay[d].push(it); });
    pool = rest;
  }
  const unscheduled = pool; // 크레딧이 부족하게 조정된 경우에만 남음
  const byLecture={};
  activeLectures().forEach(l=>{ byLecture[l.id]={new:null,r1:null,r2:null}; });
  Object.values(byDay).flat().forEach(it=>{ byLecture[it.lecId][it.type]=it.day; });
  return {byDay, byLecture, unscheduled, startDay, uEnd};
}

function slots(l){
  const st=S.lec[l.id]; if(st.enc==null) return [];
  const bl = SCHEDULE.byLecture[l.id] || {r1:null,r2:null};
  return [1,2].map(k=>{
    const type = k===1?'r1':'r2';
    return {key:k, label:STAGE_DESC[k].desc, due:bl[type], done:st.r[k]};
  });
}
function encQueue(){ return (SCHEDULE.byDay[S.cur]||[]).filter(it=>it.type==='new').map(it=>byId(it.lecId)); }
function preQueue(){
  return activeLectures().filter(l=> S.lec[l.id].enc==null && SCHEDULE.byLecture[l.id].new!==S.cur)
    .sort((a,b)=>{
      const da=SCHEDULE.byLecture[a.id].new, db=SCHEDULE.byLecture[b.id].new;
      if(da==null && db==null) return a.id-b.id;
      if(da==null) return 1; if(db==null) return -1;
      return da-db || a.id-b.id;
    });
}
/* 오늘 락에 이미 들어간 것 말고, "지금 당장 미리 끝내고 싶은" 복습들을 수동으로 고를
   수 있게 보여준다 — 알고리즘이 여유될 때 자동으로 당겨주는 것과는 별개의 수동 경로. */
function previewReviewQueue(){
  const lockedKeys = new Set((S.todayLock&&S.todayLock.day===S.cur? S.todayLock.items:[]).map(it=>it.lecId+':'+it.type));
  const out=[];
  activeLectures().forEach(l=>{
    const st=S.lec[l.id];
    if(st.enc==null) return;
    if(!st.r[1] && !lockedKeys.has(l.id+':r1')) out.push({type:'r1', l});
    else if(st.r[1] && !st.r[2] && !lockedKeys.has(l.id+':r2')) out.push({type:'r2', l});
  });
  return out.sort((a,b)=>{
    const da=SCHEDULE.byLecture[a.l.id][a.type], db=SCHEDULE.byLecture[b.l.id][b.type];
    if(da==null && db==null) return a.l.id-b.l.id;
    if(da==null) return 1; if(db==null) return -1;
    return da-db || a.l.id-b.l.id;
  });
}
/* 오늘(l.day===S.cur)이 실제 수업일인데, 이미 그 전에(예습으로) 인코딩이 끝난 강의 —

function flowCard(type, l){
  const st = S.lec[l.id];

  const steps = SUB_STEPS[type];
  const sc = st.subCheck[type] || (st.subCheck[type]={});
  const label = type==='new'?'신규':(type==='r1'?'1차':'2차');

    </div>
    <div class="flowbody" style="display:${expandedFlowCards.has(flowKey)?'block':'none'}"></div>
  </div>`);
  const body = item.querySelector('.flowbody');
  steps.forEach((label2, i)=>{
    const row = el(`<div class="substep"><span class="schk ${sc[i]?'done':''}">${sc[i]?'✓':''}</span><span class="slabel ${sc[i]?'done':''}">${esc(label2)}</span></div>`);
    row.querySelector('.schk').onclick=(e)=>{
      e.stopPropagation();
      sc[i] = !sc[i];
      saveApp(); render();
    };
    body.appendChild(row);
  });
  item.querySelector('.flowhead').addEventListener('click', (e)=>{
    if(e.target.closest('.flowdone')) return;
    const expanded=body.style.display!=='none';
    body.style.display=expanded?'none':'block';
    if(expanded) expandedFlowCards.delete(flowKey);
    else expandedFlowCards.add(flowKey);
  });
  item.querySelector('.flowdone').onclick=(e)=>{
    e.stopPropagation();
    if(type==='new'){ st.enc=done ? null : S.cur; }
    else { const key=type==='r1'?1:2; st.r[key]=!done; if(!st.rDay) st.rDay={1:null,2:null}; st.rDay[key]=st.r[key] ? S.cur : null; }
    saveApp(); render();
  };
  return item;
}

function slotChip(l, slot){
  const cls = slot.done ? 'done' : (slot.due==null ? 'na' : (slot.due===S.cur ? 'due' : 'inactive'));
  const label = slot.key;
  const title = `${slot.key}차: ${STAGE_DESC[slot.key].desc}` + (slot.due!=null? ` (예정 Day${slot.due})` : (slot.done? '' : ' — 남은 기간 안에 배정하지 못했습니다.'));
  const clickable = S.lec[l.id].enc!=null && (slot.done || slot.due===S.cur);
  if(clickable){
    const b = el(`<button class="${cls}" title="${title}">${label}</button>`);
    b.onclick=()=>{
      const nv = !S.lec[l.id].r[slot.key];
      S.lec[l.id].r[slot.key] = nv;
      if(!S.lec[l.id].rDay) S.lec[l.id].rDay={1:null,2:null};
      S.lec[l.id].rDay[slot.key] = nv ? S.cur : null;
      saveApp(); render();
    };
    return `<div class="chip">${b.outerHTML}<span class="lbl">${slot.key}</span></div>`;
  }
  return `<div class="chip"><span class="sq ${S.lec[l.id].enc==null?'inactive':cls}" title="${title}"></span><span class="lbl">${slot.key}</span></div>`;
}

function tagGroupsHtml(items, isDoneFn){
  const groups={new:[], r1:[], r2:[]};
  items.forEach(it=>{ if(groups[it.type]) groups[it.type].push(it); });
  const labels={new:'신규',r1:'1차',r2:'2차'};
  let html='';
  ['new','r1','r2'].forEach(type=>{
    if(!groups[type].length) return;
    const tags = groups[type].map(it=>{
      const l=byId(it.lecId); if(!l) return '';
      const done = isDoneFn ? isDoneFn(it) : false;
      return `<span class="plantag ${type} ${done?'done':''}">${esc(l.code)}</span>`;
    }).join('');
    html += `<div class="plantaggrp"><span class="glbl">${labels[type]}</span>${tags}</div>`;
  });
  return html? `<div class="plantags">${html}</div>` : '';
}
function renderPlan(){
  renderTypeCostInputs();
  const box=document.getElementById('planList'); box.innerHTML='';
  const warnEl=document.getElementById('planWarn');
  const uEnd=usableDays();
  if(SCHEDULE.unscheduled.length){
    const names = SCHEDULE.unscheduled.slice(0,6).map(it=>{
      const l=byId(it.lecId); const kind = it.type==='new'?'신규':(it.type==='r1'?'1차':'2차');
      return `${l.code}(${kind})`;
    }).join(', ');
    warnEl.innerHTML = `<p class="hint" style="color:var(--warn);font-weight:700">⚠ 남은 시험기간 안에 다 못 채운 항목이 ${SCHEDULE.unscheduled.length}개 있습니다. (${esc(names)}${SCHEDULE.unscheduled.length>6?' 외':''}). 하루 목표 크레딧을 올리거나 시험범위를 조정해야합니다.</p>`;
    warnEl.style.display='';
  } else { warnEl.style.display='none'; warnEl.innerHTML=''; }

  let scale=0.01;
  for(let d=S.cur; d<=S.examDay; d++){
    const load = d===S.cur ? lockedTodayTotalCost() : (SCHEDULE.byDay[d]||[]).reduce((a,it)=>a+it.cost,0);
    scale=Math.max(scale, load, dayCapacity(d));
  }
  scale*=1.08;

  for(let d=S.cur; d<=S.examDay; d++){
    const info=dInfo(d);
    const cap=dayCapacity(d);
    const blocked = d>uEnd;
    const isToday = d===S.cur;
    const cls = isToday?'cur':'';
    let barHtml, tagsHtml, n=0, r1=0, r2=0;

    if(isToday){
      const total=lockedTodayTotalCost(), done=lockedTodayDoneCost(), remaining=Math.max(0,total-done);
      const donePct=Math.min(100, done/scale*100);
      const remPct=Math.min(100-donePct, remaining/scale*100);
      const capPct=Math.min(100, cap/scale*100);
      barHtml = `<div class="pbarwrap"><div class="pbar2">
        <div class="pbarseg" style="width:${donePct}%;background:var(--done)"></div>
        <div class="pbarseg" style="width:${remPct}%;background:var(--progress)"></div>
      </div><div class="pcapline" style="left:${capPct}%"></div></div>`;
      const items = S.todayLock.items;
      n=items.filter(it=>it.type==='new').length; r1=items.filter(it=>it.type==='r1').length; r2=items.filter(it=>it.type==='r2').length;
      tagsHtml = tagGroupsHtml(items, it=>{
        const st=S.lec[it.lecId]; if(!st) return false;
        if(it.type==='new') return st.enc!=null;
        if(it.type==='r1') return !!st.r[1];
        return !!st.r[2];
      });
    } else {
      const items = SCHEDULE.byDay[d]||[];
      const load = items.reduce((a,it)=>a+it.cost,0);
      const loadPct=Math.min(100, load/scale*100);
      const capPct=Math.min(100, cap/scale*100);
      let color = blocked? 'var(--inactive-soft)' : (load>cap+1e-9?'var(--warn)':'var(--progress)');
      if(load<1e-9 && !blocked) color='var(--inactive-soft)';
      barHtml = `<div class="pbarwrap"><div class="pbar" style="width:${loadPct}%;background:${color}"></div><div class="pcapline" style="left:${capPct}%"></div></div>`;
      n=items.filter(it=>it.type==='new').length; r1=items.filter(it=>it.type==='r1').length; r2=items.filter(it=>it.type==='r2').length;
      tagsHtml = tagGroupsHtml(items, null);
    }

    const capInput = blocked? '' : `<input type="number" step="0.25" min="0" class="capinput" data-day="${d}" value="${cap.toFixed(2)}">`;
    const row = el(`<div class="planrow ${cls}">
      <div class="pd">Day${d}<div class="pdate">${info.date}(${info.dow})</div></div>
      <div>
        ${barHtml}
        ${tagsHtml}
        ${blocked?`<div class="pnote">분배 제외${info.note?' · '+esc(info.note):''}</div>`:(info.note?`<div class="pnote">${esc(info.note)}</div>`:'')}
      </div>
      <div class="pcount">신규 ${n}·1차 ${r1}·2차 ${r2}${capInput}</div>
    </div>`);
    if(!blocked){
      row.querySelector('.capinput').addEventListener('change', e=>{
        const v=parseFloat(e.target.value);
        if(!S.capOverride) S.capOverride={};
        if(isNaN(v) || v<0) delete S.capOverride[d]; else S.capOverride[d]=v;
        if(d===S.cur) S.todayLock=null; // 오늘 크레딧 자체를 바꿨으니 오늘 몫도 다시 정한다(이미 완료한 건 보존)
        saveApp(); render();
      });
    }
    box.appendChild(row);
  }
}

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(e2){} document.body.removeChild(ta);
  }
  btn.textContent='복사됨'; btn.classList.add('copied');
  showToast('클립보드에 복사됨');
  setTimeout(()=>{ btn.textContent='복사'; btn.classList.remove('copied'); }, 1400);
}

const mask=document.getElementById('mask'); let _cb=null;
function askConfirm(title, body, onYes, yesLabel){
  document.getElementById('mkT').textContent=title;
  document.getElementById('mkB').textContent=body;
  document.getElementById('mkYes').textContent = yesLabel || '되돌리기';
  mask.classList.add('on'); _cb=onYes;
}
document.getElementById('mkYes').onclick=()=>{ mask.classList.remove('on'); if(_cb) _cb(); };
document.getElementById('mkNo').onclick=()=>{ mask.classList.remove('on'); };

/* ===== 새 블록 추가 (수동) ===== */
const nbMask=document.getElementById('nbMask');
function openAddModal(){
  document.getElementById('nbSubject').value='';
  document.getElementById('nbStart').value='';
  document.getElementById('nbExam').value='';
  document.getElementById('nbStatus').textContent='';
  nbMask.classList.add('on');
}
function closeAddModal(){ nbMask.classList.remove('on'); }
document.getElementById('nbCancel').onclick=closeAddModal;
document.getElementById('emptyAddBtn').onclick=openAddModal;

const ebMask=document.getElementById('ebMask');
let _editingBlock=null;
function dateInputValue(value){
  if(/^\d{4}-\d{2}-\d{2}$/.test(value||'')) return value;
  const match=String(value||'').match(/^(\d+)\/(\d+)/);
  return match ? `${new Date().getFullYear()}-${String(match[1]).padStart(2,'0')}-${String(match[2]).padStart(2,'0')}` : '';
}
function openEditBlockModal(block){
  _editingBlock=block;
  document.getElementById('ebSubject').value=block.name;
  document.getElementById('ebStart').value=dateInputValue(block.startDate || block.schoolDays[0]?.date);
  document.getElementById('ebExam').value=dateInputValue(block.examDate || block.schoolDays[block.schoolDays.length-1]?.date);
  document.getElementById('ebStatus').textContent='';
  ebMask.classList.add('on');
}
function closeEditBlockModal(){ ebMask.classList.remove('on'); _editingBlock=null; }
document.getElementById('ebCancel').onclick=closeEditBlockModal;
document.getElementById('ebSave').onclick=()=>{
  if(!_editingBlock) return;
  const subject=document.getElementById('ebSubject').value.trim();
  const startStr=document.getElementById('ebStart').value;
  const examStr=document.getElementById('ebExam').value;
  const statusEl=document.getElementById('ebStatus');
  if(!subject||!startStr||!examStr){ statusEl.textContent='과목명·시작일·시험일을 모두 입력해주세요.'; return; }
  if(new Date(examStr)<new Date(startStr)){ statusEl.textContent='시험일이 시작일보다 빠릅니다.'; return; }
  _editingBlock.name=subject;
  _editingBlock.startDate=startStr;
  _editingBlock.examDate=examStr;
  _editingBlock.schoolDays=buildSchoolDays(startStr,examStr,subject);
  _editingBlock.lec.forEach(l=>{ l.day=Math.min(l.day,_editingBlock.schoolDays.length); });
  _editingBlock.state.examDay=_editingBlock.schoolDays.length;
  _editingBlock.state.cur=Math.min(_editingBlock.state.cur,_editingBlock.state.examDay);
  _editingBlock.state.todayLock=null;
  activateBlock(_editingBlock.id);
  saveApp();
  closeEditBlockModal();
  render();
};

function buildSchoolDays(startStr, examStr, examLabel){
  const start=new Date(startStr+'T00:00:00'), exam=new Date(examStr+'T00:00:00');
  const dows=['일','월','화','수','목','금','토'];
  const days=[]; let idx=1;
  for(let d=new Date(start); d<=exam; d.setDate(d.getDate()+1)){
    const isExam = d.getTime()===exam.getTime();
    const dow = dows[d.getDay()];
    const isWeekend = d.getDay()===0||d.getDay()===6;
    days.push({day:idx++, date:`${d.getMonth()+1}/${d.getDate()}`, dow, note: isExam? `${examLabel} 시험` : (isWeekend?'주말·캐치업':'')});
  }
  return days;
}
document.getElementById('nbSubmit').onclick = ()=>{
  const subject = document.getElementById('nbSubject').value.trim();
  const startStr = document.getElementById('nbStart').value;
  const examStr = document.getElementById('nbExam').value;
  const statusEl = document.getElementById('nbStatus');
  if(!subject||!startStr||!examStr){ statusEl.textContent='과목명·시작일·시험일을 모두 입력해주세요.'; return; }
  if(new Date(examStr) < new Date(startStr)){ statusEl.textContent='시험일이 시작일보다 빠릅니다.'; return; }
  const schoolDays = buildSchoolDays(startStr, examStr, subject);
  const lec = [];
  const block = {id:'b'+Date.now(), name:subject, emoji:'', profReviews:'', startDate:startStr, examDate:examStr, schoolDays, lec, state:freshState(schoolDays, lec)};
  App.blocks.push(block); App.active=block.id;
  activateBlock(block.id);
  saveApp();
  closeAddModal();
  render();
  showToast(`"${subject}" 블록 생성됨 — "전체 강의" 탭에서 강의를 추가해주세요`);
};

/* ===== 강의 수정 모달 ===== */
const elMask=document.getElementById('elMask');
let _editingLec=null;
function openEditLecModal(l){
  _editingLec=l;
  document.getElementById('elCode').value=l.code;
  document.getElementById('elTitle').value=l.title;
  document.getElementById('elProf').value=l.prof;
  document.getElementById('elType').value=l.type==='실습'?'실습':'강의';
  const daySel=document.getElementById('elDay');
  daySel.innerHTML = SCHOOL_DAYS.map(d=>`<option value="${d.day}">Day${d.day} ${d.date}(${d.dow})</option>`).join('');
  daySel.value=l.day;
  elMask.classList.add('on');
}
function closeEditLecModal(){ elMask.classList.remove('on'); _editingLec=null; }
document.getElementById('elCancel').onclick=closeEditLecModal;
document.getElementById('elSave').onclick=()=>{
  if(!_editingLec) return;
  const title=document.getElementById('elTitle').value.trim();
  if(!title){ showToast('강의명을 입력해주세요'); return; }
  _editingLec.code = document.getElementById('elCode').value.trim() || _editingLec.code;
  _editingLec.title = title;
  _editingLec.prof = document.getElementById('elProf').value.trim() || '미정';
  _editingLec.type = document.getElementById('elType').value;
  _editingLec.day = parseInt(document.getElementById('elDay').value);
  S.todayLock=null; // 강의 정보가 바뀌었으니 오늘 몫도 다시 정한다
  saveApp();
  closeEditLecModal();
  render();
};

/* ===== 수동 강의 추가 (보정용) ===== */
document.getElementById('alAdd').onclick=()=>{
  const code=document.getElementById('alCode').value.trim();
  const title=document.getElementById('alTitle').value.trim();
  const prof=document.getElementById('alProf').value.trim();
  const type=document.getElementById('alType').value;
  const day=parseInt(document.getElementById('alDay').value);
  if(!title){ showToast('강의명을 입력해주세요'); return; }
  const newId = (LEC.reduce((m,l)=>Math.max(m,l.id),0))+1;
  LEC.push({id:newId, day, code:code||`강${newId}`, title, prof:prof||'미정', type});
  S.lec[newId]=freshLecState();
  S.todayLock=null; // 강의가 늘었으니 오늘 몫도 다시 정한다
  document.getElementById('alCode').value=''; document.getElementById('alTitle').value=''; document.getElementById('alProf').value='';
  saveApp(); render();
};

/* ===== 단계별 크레딧 조정 ===== */
[['tcNew','new'],['tcR1','r1'],['tcR2','r2']].forEach(([id,key])=>{
  document.getElementById(id).addEventListener('change', e=>{
    const v=parseFloat(e.target.value);
    if(isNaN(v) || v<0 || !S) return;
    if(!S.typeCost) S.typeCost={new:1,r1:0.5,r2:0.25};
    S.typeCost[key]=v;
    S.todayLock=null;
    saveApp(); render();
  });
});
document.getElementById('resetOverrides').onclick=()=>{
  if(!S) return;
  askConfirm('전체 크레딧 재분배', '지금까지 개별 날짜에 손댄 크레딧 조정을 전부 지우고, 현재 단계별 크레딧·남은 강의 기준으로 다시 고르게 나눕니다. 이미 완료한 항목은 그대로 유지되고 오늘 몫도 이 기준으로 다시 정해집니다.', ()=>{
    S.capOverride={};
    S.todayLock=null;
    saveApp(); render();
  }, '재분배');
};

/* ===== 컨트롤 ===== */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a;
  if(!S) return;
  if(a==='day-'&&S.cur>1) S.cur--;
  else if(a==='day+'&&S.cur<MAXDAY) S.cur++;
  else if(a==='exam-'&&S.examDay>1&&S.examDay>S.cur){ S.examDay--; S.todayLock=null; }
  else if(a==='exam+'&&S.examDay<MAXDAY){ S.examDay++; S.todayLock=null; }
  else if(a==='reset'){ askConfirm('이 블록 초기화','이 블록의 모든 진도가 초기화되며 되돌릴 수 없습니다.', ()=>{
      const b=App.blocks.find(x=>x.id===App.active); b.state=freshState(b.schoolDays,b.lec); activateBlock(b.id); saveApp(); render();
    }, '초기화'); return; }
  saveApp(); render();
});
document.querySelectorAll('.tab').forEach(tb=>{
  tb.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.panelset').forEach(x=>x.classList.remove('on'));
    tb.classList.add('on');
    document.getElementById('tab-'+tb.dataset.tab).classList.add('on');
  };
});
(async ()=>{ await loadApp(); render(); })();
</script>
