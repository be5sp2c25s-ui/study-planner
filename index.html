<!-- 블록제 통합 스터디 워크스페이스 · 멀티블록 v2 -->
<title>스터디 플래너</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="./logo.png" />
<link rel="apple-touch-icon" href="./logo.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    /* ---- 원래의 블루 팔레트 ---- */
    --bg:#F5F7FA; --surface:#FFFFFF; --surface2:#EEF1F5;
    --ink:#1C2430; --muted:#6B7787; --faint:#8E99A8;
    --line:#E2E6ED; --track:#E2E6ED;

    --accent:#2F6FED; --accent-soft:#EAF0FE;
    /* 연한 배경 위에 얹는 '파란 글자' 전용 — 버튼 배경색 그대로 쓰면 대비가 모자란다 */
    --accent-ink:#215BCC;
    --idle:#1C2430;
    --progress:#2F6FED; --progress-soft:#EAF0FE;
    --done:#2F6FED;     --done-soft:#97B0FC;
    --inactive:#565F6E; --inactive-soft:#D8DCE4;
    --warn:#002057;     --warn-soft:#FFF9D6;

    /* 넓은 면적 채움(글자 없음) */
    --fill-done:#2F6FED; --fill-progress:#7BA3F5; --fill-warn:#002057;
    /* 반투명 배경/그림자용 — 블록 색 계열이 바뀌면 JS가 이 두 값을 같이 갈아끼운다 */
    --accent-rgb:47,111,237; --donesoft-rgb:151,176,252;

    --disp:'Pretendard',-apple-system,'Segoe UI','Noto Sans KR',sans-serif;
    --sans:'Pretendard',-apple-system,'Segoe UI','Noto Sans KR',sans-serif;
    --num:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-back:cubic-bezier(.34,1.5,.64,1);
    --t-fast:150ms; --t-mid:240ms; --t-slow:420ms;
    --sh-1:0 1px 2px rgba(28,36,48,.05), 0 2px 8px rgba(28,36,48,.05);
    --sh-2:0 1px 2px rgba(28,36,48,.055), 0 6px 20px rgba(28,36,48,.07);
    --sh-3:0 2px 6px rgba(28,36,48,.075), 0 14px 34px rgba(28,36,48,.10);
    --sh-pop:0 18px 50px rgba(51,51,51,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;padding:20px 16px 70px;position:relative;min-height:100vh}
  /* 배경 아트: 라벤더/크림 blob을 화면 가장자리에 은은하게 깔아 여백에 표정을 준다 */
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(44vw 38vw at 84% -8%, rgba(var(--accent-rgb),.13), transparent 62%),
      radial-gradient(38vw 32vw at -10% 6%, rgba(var(--accent-rgb),.09), transparent 60%),
      radial-gradient(48vw 40vw at 110% 86%, rgba(var(--donesoft-rgb),.20), transparent 62%),
      radial-gradient(36vw 32vw at -8% 104%, rgba(var(--accent-rgb),.10), transparent 60%);
  }
  .wrap{max-width:1080px;margin:0 auto}

  .blocktabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .blocktab{padding:8px 15px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
  .blocktab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .blocktab.add{background:var(--surface);border:1px dashed var(--faint);color:var(--muted)}
  .blocktab.add:hover{color:var(--accent-ink);border-color:var(--accent-ink)}
  .blocktabgrp{display:inline-flex;align-items:center;gap:2px}
  .tabdel{width:18px;height:18px;border:none;border-radius:50%;background:transparent;color:var(--faint);font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .tabdel:hover{background:var(--warn-soft);color:var(--warn)}
  .tabedit{width:34px;height:24px;border:none;border-radius:7px;background:transparent;color:var(--faint);font-size:11px;line-height:1;white-space:nowrap;cursor:pointer;padding:0 5px}
  .tabedit:hover{background:var(--accent-soft);color:var(--accent-ink)}

  header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:6px 2px 18px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .dot{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:18px;line-height:1;flex-shrink:0;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .brand .dot:hover{background:var(--accent-soft);border-color:var(--accent-ink);color:var(--accent-ink)}
  .emoji-picker-wrap{position:relative;flex-shrink:0}
  .emoji-picker{position:absolute;top:40px;left:0;z-index:20;display:none;grid-template-columns:repeat(6,32px);gap:5px;max-height:70vh;overflow-y:auto;padding:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px rgba(28,36,48,.14)}
  .emoji-picker.on{display:grid}
  .emoji-choice{width:32px;height:32px;border:1px solid transparent;border-radius:7px;background:transparent;font-size:19px;line-height:1;cursor:pointer;padding:0}
  .emoji-choice:hover{background:var(--accent-soft);border-color:var(--accent-ink)}
  .brand h1{font-family:var(--sans);font-weight:800;font-size:18px;letter-spacing:-0.3px;margin:0;color:var(--ink)}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .ctrls{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);cursor:pointer;font-size:15px;color:var(--muted);background:var(--surface)}
  .stepper button:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-ink)}
  .readout{text-align:center;min-width:70px}
  .readout .n{font-size:10px;font-weight:700;color:var(--faint)}
  .readout .d{font-family:var(--sans);font-size:15px;font-weight:700;color:var(--ink)}
  .capl{font-size:10px;font-weight:700;color:var(--faint);margin-bottom:3px}
  .todaybtn{border:none;background:var(--surface2);color:var(--muted);border-radius:5px;padding:1px 5px;font-size:9.5px;font-weight:700;cursor:pointer;margin-left:4px;font-family:var(--sans)}
  .todaybtn:hover{background:var(--accent-soft);color:var(--accent-ink)}

  .gaugebar{
    position:relative;overflow:hidden;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:6px 0 16px;padding:16px 20px;border-radius:12px;
    background:linear-gradient(118deg,var(--surface) 0%,var(--surface) 52%,var(--accent-soft) 100%);
    border:1px solid var(--line); box-shadow:var(--sh-3);
  }
  .gaugebar svg{flex-shrink:0}
  .gaugebar .msg{font-family:var(--sans);font-weight:800;font-size:14px;color:var(--ink);flex:1;min-width:180px;line-height:1.5}
  .gaugebar .dnum{font-family:var(--sans);font-weight:700;font-size:27px;letter-spacing:.4px;color:var(--ink)}
  .gaugebar .msg small{display:block;font-family:var(--sans);font-weight:600;font-size:12px;color:var(--muted);margin-top:3px}
  .clover{position:absolute;font-size:15px;top:-18px;animation:fall 3.2s linear infinite}
  @keyframes fall{ to{ transform:translateY(80px) rotate(200deg); opacity:0; } }

  .tabs{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap;position:relative}
  .tab{padding:9px 15px;border-radius:10px;border:1px solid transparent;background:transparent;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);position:relative;z-index:1;transition:color var(--t-mid) var(--ease)}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--ink);color:#fff}
  .tabs.inkon .tab.on{background:transparent}
  /* 활성 탭을 따라 미끄러지는 잉크 필 — 탭 전환에 공간 이동감을 준다 */
  .tabink{position:absolute;top:0;left:0;z-index:0;border-radius:10px;background:var(--ink);pointer-events:none;opacity:0;
    transition:transform var(--t-mid) var(--ease),width var(--t-mid) var(--ease),height var(--t-mid) var(--ease),opacity var(--t-fast) linear}
  .tabink.ready{opacity:1}
  .panelset{display:none}
  .panelset.on{display:block}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:14px 0}
  .stat{background:var(--surface);border:1px solid transparent;border-radius:14px;padding:12px 14px;box-shadow:var(--sh-1);transition:transform var(--t-mid) var(--ease),box-shadow var(--t-mid) var(--ease)}
  .stat:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
  .stat .k{font-size:10.5px;color:var(--muted)}
  .stat .v{font-family:var(--sans);font-size:21px;font-weight:700;margin-top:4px;color:var(--ink)}

  .stagegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
  @media(max-width:720px){.stagegrid{grid-template-columns:1fr}}
  .stagecol{background:var(--surface);border-radius:16px;padding:14px;border-left:4px solid var(--line);box-shadow:var(--sh-1);transition:transform var(--t-mid) var(--ease),box-shadow var(--t-mid) var(--ease)}
  .stagecol:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
  .stagecol:nth-child(1){border-left-color:var(--accent)}
  .stagecol:nth-child(2){border-left-color:var(--done-soft)}
  .stagecol:nth-child(3){border-left-color:var(--line)}
  .stagecol h2{font-family:var(--sans);font-weight:800;font-size:13px;margin:0 0 2px;display:flex;align-items:center;gap:6px;color:var(--ink)}
  .stagecol .n{font-size:10.5px;background:var(--bg);color:var(--muted);border-radius:20px;padding:1px 8px;font-weight:700}
  .stagecol .desc{font-size:11px;color:var(--muted);margin:0 0 10px;line-height:1.45}
  .panel{background:var(--surface);border:1px solid transparent;border-radius:16px;padding:15px 16px;box-shadow:var(--sh-2)}
  .panel h2{font-family:var(--sans);font-weight:800;font-size:13px;margin:0 0 3px;color:var(--ink)}
  /* 형광펜으로 그은 듯한 헤딩 — 포인트 컬러를 정보 방해 없이 노출 */
  .panel > h2, .lh h2, .eeve h2{display:inline-block;padding:0 4px 1px;
    background:linear-gradient(to top, var(--accent-soft) 0 7px, transparent 7px 100%)}
  .panel .hint{font-size:11px;color:var(--muted);margin:0 0 9px}
  .card{border:1px solid transparent;border-radius:12px;padding:10px 11px;background:var(--surface);margin-bottom:8px;box-shadow:var(--sh-1);transition:transform var(--t-mid) var(--ease),box-shadow var(--t-mid) var(--ease)}
  .card:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
  .card .top{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:3px}
  .code{font-size:10.5px;font-weight:700;color:var(--muted)}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
  .badge.lab{background:var(--bg);color:var(--muted)}
  .badge.carry{background:var(--warn-soft);color:var(--warn)}
  .badge.due{background:var(--progress-soft);color:var(--accent-ink)}
  .badge.assign{background:var(--warn-soft);color:var(--warn)}
  .badge.late{background:var(--warn-soft);color:var(--warn)}
  .card .t{font-size:13px;font-weight:800}
  .card .m{font-size:10.5px;color:var(--muted);margin-top:2px}
  .go{margin-top:8px;border:none;border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
  .go.compact{padding:7px 11px;font-size:11.5px}
  .card .go + .go{margin-left:6px}
  .go.amber{background:var(--done);color:#fff}
  .empty{font-size:12px;color:var(--faint);text-align:center;padding:18px 4px}

  details.pre{margin:6px 0 14px}
  #tab-today > details.pre:first-of-type{margin-top:20px}
  details.pre summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
  details.pre > .panel{max-height:0;overflow:hidden;opacity:0;transform:translateY(-5px)}
  /* 안전망: 애니메이션용 JS 클래스(motion-open/closing)가 무슨 이유로든 안 붙어도,
     네이티브 <details open> 상태만으로 내용이 항상 보이게 한다 — 그래야 "당기기" 버튼
     같은 걸 담은 내용이 소리 없이 영구히 안 보이는 사고가 안 생긴다. */
  details.pre[open] > .panel{max-height:none;overflow:visible;opacity:1;transform:none}
  details.pre.motion-open > .panel{animation:previewBoxIn 280ms var(--ease) both}
  details.pre.motion-open > .panel .card{animation:flowStepIn 300ms var(--ease) both}
  details.pre.motion-closing > .panel{animation:previewBoxOut 280ms var(--ease) both}
  details.pre.motion-closing > .panel .card{animation:flowStepOut 230ms var(--ease) both}

  .listbox{background:var(--surface);border:1px solid transparent;border-radius:16px;margin-top:18px;overflow:hidden;box-shadow:var(--sh-2)}
  .lh{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  .lh h2{margin:0;font-size:13px;font-family:var(--sans);font-weight:800}
  .reset{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:7px 13px;font-size:11.5px;font-weight:700;cursor:pointer}
  .reset:hover{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-soft)}
  .daygrp{border-top:1px solid var(--line)}
  .dayhd{padding:9px 16px;font-size:11.5px;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:baseline}
  .dayhd .ex{color:var(--ink)}
  .row{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .row .rt{flex:1;min-width:160px}
  .row .rt .rn{font-size:13px;font-weight:700}
  .row .rt .rp{font-size:11px;color:var(--muted)}
  .chips{display:flex;gap:4px}
  .chip{display:flex;flex-direction:column;align-items:center;gap:1px;width:28px}
  .chip button, .chip span.sq{width:19px;height:19px;border-radius:6px;border:none;cursor:pointer;background:var(--inactive-soft);font-size:8.5px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--inactive)}
  .chip button.done{background:var(--done);color:#fff}
  .chip button.due{background:var(--progress);color:#fff}
  .chip button.overdue{background:var(--warn);color:#fff}
  .chip span.sq.na{background:repeating-linear-gradient(45deg,var(--line) 0 2px,var(--surface) 2px 4px);cursor:default}
  .chip span.sq.inactive{cursor:default;opacity:.6}
  .chip .lbl{font-size:8.5px;color:var(--faint)}
  .encpill{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--bg);padding:2px 9px;border-radius:20px}
  .encpill.no{color:var(--faint);background:var(--bg)}
  .undo{border:none;background:transparent;color:var(--faint);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline}
  .undo:hover{color:var(--warn)}

  .addlec{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface2)}
  .addlec input, .addlec select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11.5px;font-family:var(--sans);background:var(--surface)}
  .addlec input[type=text]{width:110px}
  .addlec button{border:none;border-radius:9px;padding:8px 14px;font-size:11.5px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}

  .plib{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:720px){.plib{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
  .pcard{background:var(--surface);border:1px solid transparent;border-radius:16px;padding:15px 16px;position:relative;box-shadow:var(--sh-1);transition:transform var(--t-mid) var(--ease),box-shadow var(--t-mid) var(--ease)}
  .pcard:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
  .pcard .ptitle{font-family:var(--sans);font-weight:800;font-size:13px;margin-bottom:2px;color:var(--ink)}
  .pcard .pwhen{font-size:10.5px;color:var(--muted);margin-bottom:8px}
  .pcard .ptext{font-size:11px;color:var(--muted);white-space:pre-wrap;line-height:1.55}
  .copybtn{margin-top:9px;border:none;color:var(--accent-ink);background:var(--accent-soft);border-radius:9px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer}
  .copybtn.copied{background:var(--accent);color:#fff}
  .pcard .pactions,.pcard .pedit-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pcard .pmod{color:var(--accent-ink);font-weight:700}
  .peditbtn,.pcancelbtn,.presetbtn,.psavedefaultbtn{margin-top:9px;border:none;color:var(--ink);background:var(--surface2);border-radius:9px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer}
  .presetbtn{color:var(--warn);background:var(--warn-soft)}
  .psavedefaultbtn{color:var(--accent-ink);background:var(--accent-soft)}
  .pedit-input{width:100%;min-height:130px;resize:vertical;border:1px solid var(--accent);border-radius:9px;padding:9px 10px;font:11px/1.55 var(--sans);color:var(--ink);background:var(--surface);margin-top:2px}
  .instruction-sub{margin-bottom:16px}
  .instruction-sub:last-of-type{margin-bottom:0}
  .instruction-sub .sublabel{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .instruction-sub .subview{white-space:pre-wrap;font-size:11px;line-height:1.6;color:var(--ink);background:var(--surface2);border-radius:9px;padding:10px 11px;max-height:260px;overflow:auto}
  .instruction-sub .subview.placeholder{color:var(--faint)}
  .instruction-sub textarea.pedit-input{min-height:110px}
  .instruction-sub textarea.pedit-input.tmpl{min-height:320px;font-size:10.5px}
  .instruction-card{grid-column:1/-1}
  .instruction-body{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .instruction-body.on{display:block}
  .instruction-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .instruction-toggle{margin-top:9px;border:none;color:var(--ink);background:var(--surface2);border-radius:9px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer}
  .review-label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .review-input{width:100%;min-height:100px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:11.5px/1.55 var(--sans);color:var(--ink);background:var(--surface)}
  .instruction-preview{margin-top:10px;max-height:300px;overflow:auto;padding:10px;background:var(--surface2);border-radius:9px;font-size:10.5px;color:var(--muted);white-space:pre-wrap}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:11px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;box-shadow:var(--sh-3);transition:opacity var(--t-mid) var(--ease),transform var(--t-slow) var(--ease-back);z-index:60}
  .toast{transform:translateX(-50%) translateY(14px)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .pull-refresh{position:fixed;top:0;left:50%;z-index:70;transform:translate(-50%,-100%);padding:7px 14px;border-radius:0 0 10px 10px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;opacity:0;transition:transform .15s,opacity .15s;pointer-events:none}
  .pull-refresh.ready{transform:translate(-50%,0);opacity:1}
  .mobile-refresh{display:none}
  @media(max-width:720px){
    .mobile-refresh{display:flex;position:fixed;right:14px;bottom:14px;z-index:40;width:32px;height:32px;align-items:center;justify-content:center;border:1px solid rgba(28,36,48,.16);border-radius:50%;background:rgba(255,255,255,.68);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);box-shadow:0 2px 8px rgba(28,36,48,.10);color:var(--muted);font-size:17px;line-height:1;cursor:pointer;opacity:.72}
    .mobile-refresh:active{opacity:1}
  }

  .mask{position:fixed;inset:0;background:rgba(28,36,48,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .mask.on{animation:maskIn var(--t-mid) var(--ease)}
  .mask.on .modal{animation:popIn 280ms var(--ease-back)}
  .mask.on{display:flex}
  .modal{background:var(--surface);border-radius:18px;max-width:360px;width:100%;padding:22px;max-height:88vh;overflow:auto;border:1px solid transparent;box-shadow:var(--sh-pop)}
  .modal.wide{max-width:420px}
  .modal h3{margin:0 0 6px;font-size:15px;font-family:var(--disp);font-weight:800;letter-spacing:-0.3px}
  .modal p{margin:0;font-size:12px;color:var(--muted);white-space:pre-line;line-height:1.55}
  .modal .acts{margin-top:16px;display:flex;justify-content:flex-end;gap:8px}
  .modal button{border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:700;cursor:pointer;border:none}
  .modal .no{background:var(--surface2);color:var(--muted)}
  .modal .yes{background:var(--warn);color:#fff}

  .form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
  .form-row label{font-size:11.5px;font-weight:700;color:var(--muted)}
  .form-row input[type=text],.form-row input[type=date]{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;font-family:var(--sans)}
  .form-row input[type=file]{font-size:11.5px}
  .nbstatus{font-size:11.5px;color:var(--muted);white-space:pre-wrap;margin-top:6px;min-height:14px}
  .primary{background:var(--accent)!important;color:#fff!important}

  .planlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .planrow{display:grid;grid-template-columns:64px minmax(0,1fr) 168px;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
  .planrow > *{min-width:0}
  .planrow.cur{border-color:var(--accent);background:var(--accent-soft)}
  .planrow.past{opacity:.5}
  .pd{font-size:11px;font-weight:800;color:var(--ink);line-height:1.3}
  .pdate{font-size:10px;font-weight:600;color:var(--muted)}
  .pbarwrap{position:relative;height:14px;background:var(--track);border-radius:7px}
  .pbar{height:100%;border-radius:7px;transition:width .2s}
  .pcapline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
  /* 오른쪽 칸: 위쪽에 개수 배지, 아래쪽(우하단)에 크레딧 조정 */
  .pside{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:9px;align-self:stretch}
  .pcount{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;font-size:10.5px;color:var(--muted)}
  .pcnt{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;background:var(--surface2);line-height:1.55}
  .pcnt i{font-style:normal;font-size:9.5px;font-weight:700;color:var(--faint);letter-spacing:.2px}
  .pcnt b{font-size:11px;font-weight:800;color:var(--ink)}
  .pcnt.zero{opacity:.42}
  .pcnt.assign{background:var(--warn-soft)}
  .pcnt.assign b{color:var(--warn)}
  .capbox{display:flex;align-items:center;gap:5px;margin-top:auto}
  .caplbl{font-size:9.5px;font-weight:700;color:var(--faint)}
  /* 모바일: 고정 150px 우측 칸이 남는 폭을 밀어내 행이 어긋난다 → 아래로 내려 한 줄로 편다 */
  @media(max-width:720px){
    .planrow{grid-template-columns:54px minmax(0,1fr);row-gap:7px;padding:9px 11px}
    .planrow .pside{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;width:100%}
    .planrow .pcount{justify-content:flex-start}
    .capbox{margin-top:0}
    .pd{line-height:1.35}
  }
  .pnote{font-size:9.5px;color:var(--muted);font-weight:700;grid-column:1/-1;margin-top:-2px}
  .capinput{width:56px;font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;margin-left:0;font-family:var(--sans)}
  /* 직접 손댄 날은 자동 계산값과 구분되게 표시한다 — 안 그러면 어느 날을 조정해뒀는지
     알 수 없어서, 계획이 이상해도 원인을 못 찾는다. */
  .capinput.overridden{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
  .capreset{margin-left:0;border:none;background:none;color:var(--muted);cursor:pointer;font-size:11px;padding:2px 3px;line-height:1}
  .capreset:hover{color:var(--ink)}
  .typecosts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;background:var(--surface2);border-radius:9px}
  .typecosts .tclbl{font-size:10.5px;font-weight:700;color:var(--muted)}
  .typecosts label{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--ink)}
  .tcinput{width:54px;font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;font-family:var(--sans)}
  .pbar2{position:relative;height:100%;display:flex;border-radius:7px;overflow:hidden}
  /* 채움 안쪽 윤곽선 — 크림 톤처럼 밝은 색이 와도 막대의 끝이 어디인지 항상 읽힌다 */
  .pbarseg{height:100%;box-shadow:inset 0 0 0 1px rgba(28,36,48,.16)}
  .pbar{box-shadow:inset 0 0 0 1px rgba(28,36,48,.16)}
  .battery-fill{box-shadow:none}
  .plantags{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .plantaggrp{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .plantaggrp .glbl{font-size:9px;font-weight:700;color:var(--faint);min-width:24px}
  /* 강의 목록은 배지 낱개 나열 대신 칸막이로 나눈 한 줄 띠 —
     개수가 늘어도 테두리·여백이 같이 늘어나지 않아 시각적 소음이 안 쌓인다. */
  .planstrip{display:inline-flex;flex-wrap:wrap;max-width:100%;border-radius:7px;overflow:hidden}
  .plancell{font-size:9.5px;font-weight:700;line-height:1.7;padding:1px 7px;border-right:1px solid rgba(28,36,48,.13)}
  .plancell:last-child{border-right:none}
  .planstrip.new{background:var(--progress-soft)}
  .planstrip.new .plancell{color:var(--accent-ink)}
  .planstrip.r1{background:var(--done-soft)}
  .planstrip.r1 .plancell{color:var(--ink)}
  .planstrip.r2{background:var(--inactive-soft)}
  .planstrip.r2 .plancell{color:var(--inactive)}
  .planstrip.assign{background:var(--warn-soft)}
  .planstrip.assign .plancell{color:var(--warn)}
  /* 완료한 강의만 채워진 칸으로 — 띠가 왼쪽부터 차오르는 것처럼 읽힌다 */
  .planstrip .plancell.done{background:var(--done);color:#fff;border-right-color:rgba(255,255,255,.3)}

  .battery-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .battery{position:relative;width:72px;height:42px;border:none;border-radius:11px;padding:5px 4px;flex-shrink:0;background:var(--track);overflow:hidden}
  .battery::after{display:none}
  /* 채움 요소는 항상 전체 폭. 수위와 물결은 전부 clip-path로 그린다 —
     그래야 "출렁임의 최대치"가 아니라 "수면의 기준선"이 곧 퍼센트가 된다. */
  .battery-fill{position:relative;width:100%;height:100%;border-radius:5px;overflow:hidden;background-repeat:no-repeat;background-position:left center;will-change:clip-path}
  .battery-pct{font-family:var(--sans);font-weight:700;font-size:23px;letter-spacing:.2px}

  .onboard{background:var(--surface);border:1px solid transparent;border-radius:16px;padding:15px 16px;margin-bottom:14px;box-shadow:var(--sh-2)}
  .onboard summary{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;font-weight:800;font-size:13px;font-family:var(--disp);list-style:none;color:var(--ink)}
  .onboard summary::-webkit-details-marker{display:none}
  .onboard-close{border:none;background:transparent;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 2px}
  .onboard-close:hover{color:var(--ink)}
  .onboard-reopen{border:1px dashed var(--faint);border-radius:9px;padding:7px 11px;background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;margin-bottom:14px}
  .onboard-reopen:hover{border-color:var(--accent-ink);color:var(--accent-ink)}
  /* 블록 사전 준비 펼침 모션 — '오늘 학습 계획'의 상세 체크리스트와 같은 곡선/타이밍 */
  details.onboard > .onboard-list{max-height:0;overflow:hidden;opacity:0;transform:translateY(-5px)}
  details.onboard[open] > .onboard-list{max-height:none;overflow:visible;opacity:1;transform:none}
  details.onboard.motion-open > .onboard-list,
  details.onboard.motion-closing > .onboard-list{overflow:hidden}
  details.onboard.motion-open > .onboard-list{animation:previewBoxIn 300ms var(--ease) both}
  details.onboard.motion-open > .onboard-list > div{animation:flowStepIn 300ms var(--ease) both}
  details.onboard.motion-closing > .onboard-list{animation:previewBoxOut 280ms var(--ease) both}
  details.onboard.motion-closing > .onboard-list > div{animation:flowStepOut 230ms var(--ease) both}

  /* ===== 공통 접힘/펼침 모션 =====
     '블록 사전 준비'와 같은 곡선·타이밍을, 접히는 모든 영역(지침·체크리스트 편집·
     프롬프트 상자·계획 카드 등)에 그대로 재사용한다. */
  .fold-anim-in{animation:previewBoxIn 300ms var(--ease) both;overflow:hidden}
  .fold-anim-in > *{animation:flowStepIn 300ms var(--ease) both}
  .fold-anim-out{animation:previewBoxOut 280ms var(--ease) both;overflow:hidden}
  .fold-anim-out > *{animation:flowStepOut 230ms var(--ease) both}
  /* 네이티브 <details>용 — summary를 뺀 본문에 같은 모션을 건다 */
  details.foldable > :not(summary){max-height:0;overflow:hidden;opacity:0;transform:translateY(-5px)}
  details.foldable[open] > :not(summary){max-height:none;overflow:visible;opacity:1;transform:none}
  details.foldable.motion-open > :not(summary){animation:previewBoxIn 300ms var(--ease) both;overflow:hidden}
  details.foldable.motion-closing > :not(summary){animation:previewBoxOut 280ms var(--ease) both;overflow:hidden}
  /* 수정칸이 나타날 때의 짧은 페이드 */
  .fadein{animation:flowStepIn 260ms var(--ease) both}

  /* 블록별 색 계열 스와치 */
  .themebar{display:flex;gap:9px;margin-top:9px;flex-wrap:wrap}
  .themedot{width:12px;height:12px;padding:0;border-radius:50%;border:none;cursor:pointer;
    transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
  .themedot:hover{transform:scale(1.2)}
  .themedot.on{box-shadow:0 0 0 2px var(--surface),0 0 0 3px rgba(28,36,48,.45)}
  .oitem{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
  .oitem:first-of-type{border-top:none;padding-top:12px}
  .ochk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
  .ochk.done{background:var(--done);border-color:var(--done);color:#fff}
  .olabel{flex:1;font-size:12px;font-weight:600}
  .olabel.done{color:var(--muted)}
  .olabel.later{color:var(--muted);font-style:italic}
  .olater-badge{font-size:9.5px;font-weight:700;color:var(--inactive);background:var(--inactive-soft);padding:1px 7px;border-radius:20px;margin-left:6px}
  .olaterbtn{border:none;background:transparent;color:var(--faint);font-size:10.5px;font-weight:700;cursor:pointer;text-decoration:underline;flex-shrink:0}
  .opromptbtn{border:none;background:var(--accent-soft);color:var(--accent-ink);font-size:10px;font-weight:700;cursor:pointer;border-radius:7px;padding:3px 8px;flex-shrink:0}
  .opromptbox{margin:6px 0 0 26px;padding:9px 11px;background:var(--surface2);border-radius:9px;font-size:10.5px;color:var(--muted);white-space:pre-wrap}
  .opromptedit{border:none;background:var(--surface2);color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;border-radius:7px;padding:3px 8px;flex-shrink:0}
  .omod{color:var(--accent-ink);font-weight:700;font-size:10px;margin-left:4px}
  .opromptedittext{margin:6px 0 0 26px;width:calc(100% - 26px);min-height:160px;resize:vertical;border:1px solid var(--accent);border-radius:9px;padding:9px 10px;font:10.5px/1.55 var(--sans);color:var(--ink);background:var(--surface)}
  .opromptsavebar{margin:6px 0 0 26px;display:flex;gap:6px}
  .opromptsavebtn{border:none;background:var(--accent);color:#fff;font-size:10px;font-weight:700;cursor:pointer;border-radius:7px;padding:5px 10px}
  .opromptcancelbtn,.opromptresetbtn,.opromptsavedefaultbtn{border:none;background:var(--surface2);color:var(--ink);font-size:10px;font-weight:700;cursor:pointer;border-radius:7px;padding:5px 10px}
  .opromptresetbtn{color:var(--warn);background:var(--warn-soft)}
  .opromptsavedefaultbtn{color:var(--accent-ink);background:var(--accent-soft)}

  .dayflow{display:flex;flex-direction:column;gap:10px;margin:16px 0}
  .flowitem{background:var(--surface);border:1px solid transparent;border-radius:14px;overflow:hidden;box-shadow:var(--sh-1);transition:transform var(--t-mid) var(--ease),box-shadow var(--t-mid) var(--ease)}
  .flowitem:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
  .flowhead{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer}
  .flowbadge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:8px;flex-shrink:0}
  .flowbadge.new{background:var(--progress-soft);color:var(--accent-ink)}
  .flowbadge.r1{background:var(--done-soft);color:var(--ink)}
  .flowbadge.r2{background:var(--inactive-soft);color:var(--inactive)}
  .flowbadge.assign{background:var(--warn-soft);color:var(--warn)}
  .flowtitle{flex:1;font-size:13px;font-weight:700;min-width:0}
  .flowmeta{font-size:10.5px;color:var(--muted);display:block;font-weight:400}
  .flowdone{border:none;border-radius:9px;padding:7px 13px;font-size:11.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;flex-shrink:0}
  .unpullbtn{border:none;border-radius:9px;padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer;background:var(--surface2);color:var(--muted);flex-shrink:0}
  .manualdelbtn{border:none;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;background:var(--warn-soft);color:var(--warn);flex-shrink:0}
  .pulledtag{color:var(--accent-ink);font-weight:700}
  .flowdone.done{color:var(--ink)}
  .flowpromptbtn{border:none;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:700;cursor:pointer;background:var(--accent-soft);color:var(--accent-ink);flex-shrink:0}
  .flowpromptbtn.copied{background:var(--accent);color:#fff}
  .ppcount{display:inline-block;min-width:13px;padding:0 3px;border-radius:20px;background:var(--accent);color:#fff;font-size:9px;line-height:13px;text-align:center;margin-left:2px}
  /* 단계에 묶인 프롬프트가 여러 개일 때 카드 안에서 펼쳐지는 선택 목록 */
  .promptpick{display:none;max-height:0;overflow:hidden;padding:4px 10px 9px;border-top:1px solid var(--line)}
  .promptpick.open{max-height:600px}
  .promptpick.opening{animation:flowDetailIn 280ms var(--ease) both}
  .promptpick.opening .ppitem{animation:flowStepIn 300ms var(--ease) both}
  .promptpick.closing{animation:flowDetailOut 280ms var(--ease) both}
  .promptpick.closing .ppitem{animation:flowStepOut 230ms var(--ease) both}
  .ppitem{display:flex;width:100%;gap:8px;align-items:baseline;border:none;background:transparent;text-align:left;
    padding:7px 8px;border-radius:8px;cursor:pointer;font-family:var(--sans)}
  .ppitem:hover{background:var(--accent-soft)}
  .ppnum{font-size:10px;font-weight:700;color:var(--faint);min-width:12px;flex-shrink:0}
  .ppname{font-size:11.5px;font-weight:700;color:var(--ink);flex:1}
  .cpedit{display:flex;flex-direction:column;gap:6px;margin-top:9px}
  .cprow{display:flex;gap:6px;flex-wrap:wrap}
  .cpname,.cpcat{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;font-family:var(--sans);background:var(--surface);color:var(--ink)}
  .cpname{flex:1;min-width:150px}
  .cpwhen{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:11.5px;font-family:var(--sans);background:var(--surface);color:var(--ink);width:100%}
  .cprestorebtn{margin-top:9px;border:none;border-radius:9px;padding:8px 15px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--ink);cursor:pointer}
  .compare-copy{margin-top:2px}
  /* ===== 시험 당일 · 블록 끝내기 ===== */
  .finish-wrap{text-align:center;padding-bottom:16px}
  .finish-btn{border:none;background:var(--accent);color:#fff;border-radius:12px;padding:11px 24px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:var(--sh-2);transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
  .finish-btn:hover{transform:translateY(-1px);box-shadow:var(--sh-3)}
  .finish-hint{font-size:10.5px;color:var(--faint);margin-top:8px}
  .finish-done{text-align:center;padding:24px 14px 18px;background:var(--accent-soft);border-radius:16px;margin:4px 0 10px}
  .finish-done .finish-emoji{font-size:32px;line-height:1;margin-bottom:8px}
  .finish-done b{display:block;font-size:14.5px;color:var(--accent-ink);letter-spacing:-0.2px}
  .finish-done p{margin:5px 0 0;font-size:11.5px;color:var(--muted)}
  .finish-undo{margin-top:12px;border:none;background:transparent;color:var(--faint);font-size:10.5px;text-decoration:underline;cursor:pointer}
  .modal.celebrate{text-align:center;max-width:340px}
  .modal.celebrate .cb-emoji{font-size:46px;line-height:1;margin:6px 0 12px}
  .modal.celebrate h3{font-size:16px;line-height:1.4}
  .modal.celebrate p{margin-top:6px}
  .modal.celebrate .acts{justify-content:center}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .confetti i{position:absolute;top:-16px;width:8px;height:12px;border-radius:2px;opacity:0;animation:confettiFall 2.8s cubic-bezier(.25,.6,.4,1) forwards}
  @keyframes confettiFall{0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg)}85%{opacity:1}100%{opacity:0;transform:translate3d(var(--dx),108vh,0) rotate(var(--rot))}}
  .cpaddbtn{margin-top:9px;border:none;border-radius:9px;padding:8px 15px;font-size:11.5px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
  .badge.cat{background:var(--accent-soft);color:var(--accent-ink)}
  .cphint{font-size:10.5px;color:var(--faint);margin-top:6px}
  .add-plan-btn{align-self:flex-start;border:1px dashed var(--faint);border-radius:9px;padding:8px 12px;background:var(--surface);color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer}
  .add-plan-btn:hover{border-color:var(--accent-ink);background:var(--accent-soft);color:var(--accent-ink)}
  .flowbody{display:none;max-height:0;overflow:hidden;padding:2px 14px 12px 14px;border-top:1px solid var(--line)}
  .flowbody.open{max-height:600px}
  .flowbody.opening{animation:flowDetailIn 280ms var(--ease) both}
  .flowbody.opening .substep{animation:flowStepIn 300ms var(--ease) both}
  .flowbody.closing{animation:flowDetailOut 280ms var(--ease) both}
  .flowbody.closing .substep{animation:flowStepOut 230ms var(--ease) both}

   실제로 동작한다. 예: {"rules": {".read": true, ".write": true}} (본인만 쓰는
   개인용 앱이라도 규칙을 열어두지 않으면 기본값(전체 차단)이라 아무것도 저장되지

function themeOf(block){ return (block && THEMES[block.theme]) ? block.theme : 'blue'; }
function applyTheme(block){
  const t=THEMES[themeOf(block)];
  const r=document.documentElement.style;
  r.setProperty('--accent',t.accent);
  r.setProperty('--accent-soft',t.soft);
  r.setProperty('--accent-ink',t.ink);
  r.setProperty('--progress',t.accent);
  r.setProperty('--progress-soft',t.soft);
  r.setProperty('--done',t.accent);
  r.setProperty('--done-soft',t.doneSoft);
  r.setProperty('--fill-done',t.accent);
  r.setProperty('--fill-progress',t.fill);
  r.setProperty('--fill-warn',t.warn);
  r.setProperty('--warn',t.warn);
  r.setProperty('--warn-soft',t.warnSoft);
  r.setProperty('--accent-rgb',t.rgb);
  r.setProperty('--donesoft-rgb',t.softRgb);
}
function renderThemeSwatches(block){
  const bar=document.getElementById('themeBar'); if(!bar) return;
  bar.innerHTML='';
  const cur=themeOf(block);
  Object.keys(THEMES).forEach(key=>{
    const t=THEMES[key];
    const dot=el(`<button type="button" class="themedot ${key===cur?'on':''}" title="${t.name} 계열" aria-label="${t.name} 계열" aria-pressed="${key===cur}" style="background:${t.fill}"></button>`);
    dot.onclick=()=>{ block.theme=key; applyTheme(block); saveApp(); render(); };
    bar.appendChild(dot);
  });
}

/* 기본 프롬프트(p1~p5)를 한 번만 '프롬프트 목록'으로 옮긴다. 이후로는 기본/직접 추가 구분 없이
   전부 이름·단계·설명·내용을 고치고 삭제할 수 있다. 예전에 고쳐둔 문구는 그대로 이어받는다. */
function builtinPromptEntry(p, app){
  const pick=o=>{ const v=o && o[p.id]; return (typeof v==='string' && v.trim().length) ? v : null; };
  return {id:p.id, name:shortPromptName(p.t), cat:BUILTIN_PROMPT_CAT[p.id]||'none', when:p.w,
          text:(app && (pick(app.promptOverrides) || pick(app.promptDefaults))) || p.x};
}
/* 콘텐츠 버전 3: 기본 프롬프트를 Ⓐ~Ⓓ로, Custom instructions를 새 지침으로 한 번 교체한다.
   직접 추가한 프롬프트는 그대로 두고, 예전 기본 프롬프트(p1~p5)와 지침 수정본만 새것으로 바꾼다. */
const CONTENT_VERSION=3;
const OLD_BUILTIN_IDS=['p1','p2','p3','p4','p5','pa','pb','pc','pd'];
function migrateBuiltinPrompts(app){
  if((app.contentVersion||0) >= CONTENT_VERSION) return;
  const mine=app.customPrompts.filter(cp=>cp && !OLD_BUILTIN_IDS.includes(cp.id));
  app.customPrompts=PROMPTS().map(p=>builtinPromptEntry(p, null)).concat(mine);
  OLD_BUILTIN_IDS.forEach(id=>{ delete app.promptOverrides[id]; delete app.promptDefaults[id]; });
  app.customInstructionOverride='';
  app.customInstructionDefault='';
  app.promptsUnified=true;
  app.contentVersion=CONTENT_VERSION;
}
function normalizeApp(app){
  if(!app || !Array.isArray(app.blocks)) return app;
  if(!app.promptOverrides || typeof app.promptOverrides!=='object') app.promptOverrides={};
  if(!app.promptDefaults || typeof app.promptDefaults!=='object') app.promptDefaults={};
  if(typeof app.customInstructionOverride!=='string') app.customInstructionOverride='';
  if(typeof app.customInstructionDefault!=='string') app.customInstructionDefault='';
  if(!app.compareDismissed || typeof app.compareDismissed!=='object') app.compareDismissed={};
  if(!app.onboardingDismissed || typeof app.onboardingDismissed!=='object') app.onboardingDismissed={};
  if(typeof app.rev!=='number') app.rev=0; // 옛 저장분 호환용 기본값
  if(!app.subSteps || typeof app.subSteps!=='object') app.subSteps={};
  if(!Array.isArray(app.customPrompts)) app.customPrompts=[];
  migrateBuiltinPrompts(app);
  /* 직접 고친 체크리스트들(사전 준비·전날 루틴·매일 반복). 없으면 기본값을 쓴다. */
  if(app.onboardSteps!=null && !Array.isArray(app.onboardSteps)) delete app.onboardSteps;
  if(app.examEveSteps!=null && !Array.isArray(app.examEveSteps)) delete app.examEveSteps;
  if(app.dailySteps!=null && !Array.isArray(app.dailySteps)) delete app.dailySteps;
  /* 매일 반복 항목이 여러 개가 될 수 있게 ankiCheck(단일 체크) → dailyCheck(항목별 체크)로 옮긴다 */
  app.blocks.forEach(b=>{
    const st=b && b.state; if(!st) return;
    if(!st.dailyCheck || typeof st.dailyCheck!=='object'){
      st.dailyCheck={};
      if(st.ankiCheck && typeof st.ankiCheck==='object'){
        Object.entries(st.ankiCheck).forEach(([day,v])=>{ if(v) st.dailyCheck[day]={0:true}; });
      }
    }
  });
  app.blocks.forEach(b=>{ if(!b || !THEMES[b.theme]) { if(b) b.theme='blue'; } }); // 색 계열 기본값
  return app;
}

function captureUndoSnapshot(target){
  const control=target.closest('button,.ochk,.schk,.capinput');
  if(!control || control.closest('.tab,.copybtn,.opromptbtn,.instruction-toggle')) return;
  undoSnapshot=JSON.stringify(App);
}
document.addEventListener('click', e=>captureUndoSnapshot(e.target), true);
document.addEventListener('keydown', e=>{
  if(!(e.ctrlKey || e.metaKey) || e.key.toLowerCase()!=='z') return;
  const active=document.activeElement;
  if(active && (active.matches('input,textarea,[contenteditable="true"]') || active.isContentEditable)) return;
  if(!undoSnapshot) return;
  e.preventDefault();
  const prevRev = App.rev || 0;
  try{ App=JSON.parse(undoSnapshot); }catch(error){ return; }
  /* 되돌리기는 내용만 과거로 돌리고 rev(저장 순번)는 계속 앞으로 간다 — rev까지 같이
     내려가면, 되돌리기 직후 도착한 동기화 스냅샷이 "더 최신"으로 판정돼 방금 되돌린
     변경을 그대로 되살려 버린다. */
  App.rev = prevRev;
  undoSnapshot=null;
  if(App.blocks.length){
    const block=App.blocks.find(b=>b.id===App.active) || App.blocks[0];
    activateBlock(block.id);
  } else { S=null; LEC=[]; SCHOOL_DAYS=[]; MAXDAY=0; }
  saveApp(); render(); showToast('방금 한 작업을 되돌렸습니다.');
});

function freshState(schoolDays, lec){
  const m={}; lec.forEach(l=> m[l.id]=freshLecState());
  return {cur:1, examDay: schoolDays.length, capOverride:{}, todayLock:null, typeCost:{new:1,r1:0.5,r2:0.25}, onboarding:{}, examEve:{}, ankiCheck:{}, dailyCheck:{}, manualPlans:{}, pulledReviews:{}, lec:m};
}
function freshLecState(){
  return {enc:null, r:{1:false,2:false}, rDay:{1:null,2:null}, subCheck:{new:{},r1:{},r2:{},assign:{}}, excluded:false};
}
function activateBlock(id){
  const b=App.blocks.find(x=>x.id===id); if(!b) return;
  App.active=id; SCHOOL_DAYS=b.schoolDays; LEC=b.lec; MAXDAY=SCHOOL_DAYS.length; S=b.state;
  applyTheme(b);
}
async function loadApp(){
  try{ const r=await store.get(GKEY); const p=JSON.parse(r.value); if(p&&Array.isArray(p.blocks)) App=p; }catch(e){ App={blocks:[],active:null,promptOverrides:{},promptDefaults:{},customInstructionOverride:'',customInstructionDefault:'',compareDismissed:{},onboardingDismissed:{}}; }
  normalizeApp(App);
  if(App.blocks.length){
    const found = App.blocks.find(b=>b.id===App.active);
    activateBlock(found? App.active : App.blocks[0].id);
  }
}
let saveQueue=Promise.resolve();
/* App.rev: 저장할 때마다 하나씩 올라가는 단조증가 번호. 새로고침·실시간 동기화로 들어오는
   스냅샷이 "내가 방금 로컬에서 바꾼 것"보다 오래된 걸(=rev가 더 낮은 걸) 그대로 덮어써서
   방금 한 조작(예: 오늘로 당기기)이 되돌아가 버리는 사고를 막는 용도. */
function saveApp(){
  App.rev = (App.rev||0)+1;
  const payload=JSON.stringify(App);
  saveQueue=saveQueue.then(()=>store.set(GKEY,payload)).catch(e=>console.warn(e));
  return saveQueue;
}

async function refreshApp(showMessage=false){
  expandedFlowCards.clear();
  onboardingOpen=false;
  try{
    const r=await store.get(GKEY);
    const latest=JSON.parse(r.value);
    if(latest && typeof latest.rev==='number' && typeof App.rev==='number' && latest.rev<=App.rev){
      if(showMessage) showToast('이미 최신 상태입니다.');
      return; // 저장소에 아직 반영 안 된 더 오래된 스냅샷 — 방금 한 로컬 조작을 지킨다
    }
    if(latest&&Array.isArray(latest.blocks)){
      App=normalizeApp(latest);
      const active=App.blocks.find(b=>b.id===App.active) || App.blocks[0];
      if(active) activateBlock(active.id);
      render();
      if(showMessage) showToast('최신 상태로 새로고침했습니다.');
    }
  }catch(e){ if(showMessage) showToast('새로고침에 실패했습니다.'); }
}

function startRealtimeSync(){
  if(!fbDb || !dbOnValue) return;
  dbOnValue(dbRef(fbDb,GKEY), snap=>{
    if(!snap.exists()) return;
    try{
      const latest=JSON.parse(snap.val());
      if(!latest || !Array.isArray(latest.blocks)) return;
      if(typeof latest.rev==='number' && typeof App.rev==='number' && latest.rev<=App.rev) return; // 방금 한 로컬 조작보다 오래된 에코 — 무시
      if(JSON.stringify(latest)===JSON.stringify(App)) return;
      App=normalizeApp(latest);
      const active=App.blocks.find(b=>b.id===App.active) || App.blocks[0];
      if(active) activateBlock(active.id);
      render();
      showToast('다른 기기의 변경을 반영했습니다.');
    }catch(e){ console.warn('Firebase 동기화 데이터 처리 실패',e); }
  });
}

function setupPullToRefresh(){
  let startY=0, pulling=false;
  const indicator=document.getElementById('pullRefresh');
  const refreshButton=document.getElementById('mobileRefresh');
  if(refreshButton) refreshButton.onclick=()=>refreshApp(true);
  document.addEventListener('touchstart',e=>{
    if(window.scrollY===0 && e.touches.length===1){ startY=e.touches[0].clientY; pulling=true; }
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!pulling) return;
    const distance=Math.max(0,Math.min(96,e.touches[0].clientY-startY));
    if(distance<8){ indicator.classList.remove('ready'); return; }
    e.preventDefault();
    indicator.classList.toggle('ready',distance>=64);
    indicator.textContent=distance>=64?'놓으면 새로고침':'아래로 당기는 중';
  },{passive:false});
  document.addEventListener('touchend',async()=>{
    if(!pulling) return;
    const ready=indicator.classList.contains('ready');
    pulling=false; indicator.classList.remove('ready'); indicator.textContent='놓으면 새로고침';
    if(ready){ indicator.classList.add('ready'); indicator.textContent='새로고침 중...'; await refreshApp(true); indicator.classList.remove('ready'); }
  },{passive:true});
}

/* ===== 3단계 체크리스트 정의 =====
   신규(당일): 필기본 업로드→Claude 인출→정리본(PDF) 생성. 이미지 삽입·레이아웃은 직접.

const STAGE_DESC = [

/* 각 단계 실제 작업 순서 — 메인 리스트에서 항목별로 펼쳐 보여주는 체크리스트.
   여기 체크는 순전히 개인 트래킹용이라 알고리즘(enc/r)에는 영향 없음. */
const SUB_STEPS = {
  new: ['필기 주석 flatten','인출 & 문제 풀이','정리본 제작(사진, 그림, 암기법)'],

  r2: ['정리본 1회독 (Highlights)','Anki 제작'],
};
/* 프롬프트 탭에서 직접 고친 체크리스트가 있으면 그걸 쓰고, 없으면 위 기본값을 쓴다.
   체크 기록(subCheck)은 배열 인덱스로 저장되므로, 항목 순서를 바꾸면 체크 위치도 함께 밀린다. */
function subSteps(type){
  const v = App.subSteps && App.subSteps[type];
  return Array.isArray(v) ? v : (SUB_STEPS[type] || []); // 빈 배열 = 일부러 다 지운 상태
}
/* ===== 체크리스트 입력 =====
   체크리스트를 쓰는 칸에서 Enter를 치면 줄글로 이어지지 않고 다음 줄에 말머리(☐)가
   먼저 찍힌다. 저장할 때는 말머리를 떼고 순수한 문구만 배열로 보관한다. */
const CHK_BULLET='☐ ';
const CHK_BULLET_RE=/^[\s\u00a0]*(?:[☐☑✔✓•·▪‣∙\-*]+[\s\u00a0]*)+/;
function parseChecklist(text){
  return String(text||'').split(/\r?\n/).map(line=>line.replace(CHK_BULLET_RE,'').trim()).filter(Boolean);
}
function bulletize(lines){
  const arr = Array.isArray(lines) ? lines : String(lines||'').split(/\r?\n/);
  return arr.map(x=>String(x).replace(CHK_BULLET_RE,'').trim()).filter(Boolean).map(x=>CHK_BULLET+x).join('\n');
}
function insertAtCursor(ta, text){
  const start=ta.selectionStart, end=ta.selectionEnd;
  ta.value = ta.value.slice(0,start) + text + ta.value.slice(end);
  const pos = start + text.length;
  ta.setSelectionRange(pos,pos);
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}
function bindChecklistInput(ta){
  if(!ta || ta._chkBound) return; ta._chkBound=true;
  ta.addEventListener('focus', ()=>{
    if(!ta.value){ ta.value=CHK_BULLET; ta.setSelectionRange(ta.value.length, ta.value.length); }
  });
  ta.addEventListener('keydown', e=>{
    if(e.key!=='Enter' || e.shiftKey || e.isComposing || e.keyCode===229) return; // 한글 조합 중 Enter는 글자 확정용
    e.preventDefault();
    insertAtCursor(ta, '\n'+CHK_BULLET);
  });
}
/* ===== 공통 접힘/펼침 =====
   '블록 사전 준비'가 쓰던 곡선·타이밍(previewBox + 항목 stagger)을 어디서나 재사용한다. */
function playFold(body, opening, after){
  const rows=[...body.children];
  clearTimeout(body._foldTimer);
  body.classList.remove('fold-anim-in','fold-anim-out');
  rows.forEach(r=>{ r.style.animationDelay=''; });
  void body.offsetWidth; // 같은 애니메이션을 다시 걸기 위한 리플로우
  const cls = opening ? 'fold-anim-in' : 'fold-anim-out';
  body.classList.add(cls);
  rows.forEach((r,i)=>{ r.style.animationDelay=`${(opening? i : rows.length-1-i)*35}ms`; });
  body._foldTimer=setTimeout(()=>{ body.classList.remove(cls); if(after) after(); }, 320+rows.length*35);
}
function foldOpen(body, display){ body.style.display = display || 'block'; playFold(body, true); }
function foldClose(body, after){
  if(body.style.display==='none'){ if(after) after(); return; }
  playFold(body, false, ()=>{ body.style.display='none'; if(after) after(); });
}
function foldToggle(body, display){
  const open = body.style.display!=='none' && !body.classList.contains('fold-anim-out');
  if(open) foldClose(body); else foldOpen(body, display);
  return !open;
}
/* .flowbody(오늘 카드 본문)용 — 기존 open/opening/closing 클래스 체계를 그대로 쓴다 */
function toggleFlowBody(body, onOpen, onClose){
  const expanded = body.style.display!=='none' && !body.classList.contains('closing');
  clearTimeout(body.closeTimer);
  if(expanded){
    body.classList.remove('open');
    body.classList.add('closing');
    [...body.children].forEach((row,i)=>{ row.style.animationDelay=`${(body.children.length-1-i)*45}ms`; });
    body.closeTimer=setTimeout(()=>{ body.style.display='none'; body.classList.remove('closing'); }, 280+body.children.length*45);
    if(onClose) onClose();
  }else{
    body.style.display='block';
    body.classList.remove('closing');
    body.classList.add('open','opening');
    setTimeout(()=>body.classList.remove('opening'),320);
    [...body.children].forEach((row,i)=>{ row.style.animationDelay=`${i*45}ms`; });
    if(onOpen) onOpen();
  }
}
/* 네이티브 <details>를 같은 모션으로 여닫는다 */
function bindDetailsFold(details, ignoreSelector){
  if(!details || details._foldBound) return; details._foldBound=true;
  details.classList.add('foldable');
  const summary=details.querySelector('summary');
  const body=[...details.children].find(c=>c.tagName!=='SUMMARY');
  if(!summary || !body) return;
  summary.addEventListener('click', e=>{
    if(ignoreSelector && e.target.closest(ignoreSelector)) return;
    e.preventDefault();
    const rows=[...body.children];
    const opening = !details.open || details.classList.contains('motion-closing');
    clearTimeout(details.closeTimer);
    if(opening){
      details.open=true;
      details.classList.remove('motion-closing');
      details.classList.add('motion-open');
      rows.forEach((r,i)=>{ r.style.animationDelay=`${i*35}ms`; });
    }else{
      details.classList.remove('motion-open');
      details.classList.add('motion-closing');
      rows.forEach((r,i)=>{ r.style.animationDelay=`${(rows.length-1-i)*35}ms`; });
      details.closeTimer=setTimeout(()=>{
        details.open=false;
        details.classList.remove('motion-closing');
      }, 300+rows.length*35);
    }
  });
}

  editInput.style.display=''; if(editActions) editActions.style.display='';

}

}

/* 라벨 문자열에서 만든 안정적인 체크 키 — 문구가 그대로면 체크 기록도 유지된다 */
function labelKey(label){
  let h=0;
  for(let i=0;i<label.length;i++){ h=(h*31 + label.charCodeAt(i))|0; }
  return 'c'+(h>>>0).toString(36);
}
/* 프롬프트 탭에서 직접 고친 사전 준비 목록이 있으면 그걸 쓴다.

function onboardItems(){
  const custom = App.onboardSteps;
  if(!Array.isArray(custom)) return ONBOARD_ITEMS;
  return custom.map(label=>{
    const builtin = ONBOARD_ITEMS.find(it=> it.label===label);
    return builtin || {key:labelKey(label), label};
  });
}

### 설명 말투 (설명·요약 체크리스트·오답 재설명 전부 적용)
1. 웃기고 재밌게: 세포·분자·병원체·약물·장기를 캐릭터처럼 의인화하고 상황극·과장·드립을 적극 써. 교과서 문체 금지 — 친한 선배가 카페에서 썰 풀듯이.
   (예) 파상풍 독소 = 신경의 브레이크를 끊는 놈 → 브레이크 고장 난 차 → 근육이 계속 쥐어짜임 / 보툴리눔 독소 = 액셀 자체를 뜯어가는 놈 → 차가 아예 안 움직임
   (예) 경쟁적 길항제 = 열쇠 구멍에 맞는 가짜 열쇠 꽂고 버티는 놈 → 진짜 열쇠(작용제)를 잔뜩 들이부으면 밀려남

3. 우리말 우선:

   - 나머지는 우리말로 풀어. 어려운 한자어 전문용어도 쉬운 말로 먼저 설명하고 용어는 뒤에 붙여.
   - 한 문장에 영어 용어 2개 이상 섞지 마.
4. 정리본 PDF·압축정리본·Anki·족보 해설에는 드립 빼고 압축해서 써. 기억에 도움 되는 비유만 한 줄 허용.

### 강의 간 비중
5. 모든 강의는 동일 비중. 강의 간 우열·생략 없이 순서대로 처리. 실습 강의록은 인코딩 시간·인출 문제 수를 가볍게 줄여도 돼.

### 0단계: 블록 시작 — 압축정리본 + Anki
6. 입력: 선배 정리본 + 족보(+해설) + 강의 목록. 시작 전 압축정리본 범주 지도(대분류 → 중분류 → 소속 강의) 표를 먼저 보여주고 확인받은 뒤 압축정리본 PDF → Anki 순서로 진행해.
7. 압축정리본 — 큰 그림 뼈대이자 시험 전날 여러 번 읽을 최종 자료.
   - 구조 재구성: 강의 순서가 아니라 과목의 개념 범주·위계로 재배치. 첫 페이지는 블록 전체 범주 지도 1장.
   - 최대 압축: 강의 간 겹치는 내용은 합쳐서 한 번만. 문장 대신 표·키워드·인과사슬 한 줄. 헷갈리는 항목끼리는 감별 비교표로.
   - 선별: 족보 출제 개념 위주. 족보 문제 스타일 기준으로 "이 깊이까지 외워야 하는지"를 항목마다 판별해서, 족보가 묻지 않는 깊이의 세부는 빼. 족보 반복 출제는 ★.
   - 출처: 항목 끝에 강의 번호 (예: (03강)) — 강의별 정리본과 대조하기 쉽게.
   - 옮겨 적을 자리: 각 대분류 끝에 '추가 메모' 빈 칸(가로 전체, 세로 25mm, 얇은 검정 테두리).
   - 교차검증: 선배 정리본이 족보·족보 해설과 어긋나면 해당 항목에 [확인필요] 표시하고 대화에서도 목록으로 알려줘.
   - 형식은 정리본 PDF 규격(26~37) 그대로. 문서 첫 줄은 '{과목명} 압축정리본'.
8. Anki
   - 선별: 족보 빈출, 교수 강조(선배 정리본·족보 해설에 표시된 것), 선배 정리본 강조 중 겹치거나 출제 가능성 높은 것만. (암기 불필요)는 어떤 기준으로도 제외.
   - 원자 단위: 개념 하나당 카드 하나. Basic과 Cloze를 적절히 섞어. 필요하면 Hint·Extra 사용, 암기법·비유는 뒷면에 작은 글씨.
   - 카드 문제는 족보 출제 방식 반영. 수치·인명·연도는 기출·교수 강조가 아니면 제외. 풀네임 단답 출제 경향이면 직접 입력 카드.
   - 태그: 강의 코드 + 출처(족보빈출/교수강조).
   - 덱: "{과목명}::nn강. 강의제목" 하위 덱으로 나눠 하나의 .apkg로 제공. 분량이 많으면 몇 강씩 나눠 만들고 마지막에 합쳐.

### 1단계: 신규 인코딩
9. 시작 전 대단원 목차와 우선순위(상/중/하) 표를 보여주고 확인받은 뒤 진행. 강의록 전체를 한 번에 쏟지 말고 대단원/주제별로 끊어서.
10. 우선순위: 과목 설정의 스탬프가 붙은 슬라이드는 더 깊게. 스탬프 없는 슬라이드도 절대 생략 X — 강의 안에서 깊이 배분용일 뿐.
11. 무생략: 세부 수치·분류·기전·예외까지 전부.
12. 형식: 핵심 용어 굵게. 분류·감별·특성 비교는 표, 병태·기전·신호전달·약리작용은 인과사슬(원인→기전→결과). 줄글 최소화. 꼭 필요한 그림만 규격의 자리표시 형식으로.
13. 챕터 시작 시 1~2줄: 이 강의 전체 흐름 + 압축정리본 큰 그림에서 이 챕터의 위치.
14. 챕터 순서: 설명 → 3~5줄 요약 체크리스트 → 미니 인출.
15. 필기에 "외우지 마"·"암기 불필요"류 → 내용 옆에 (암기 불필요). "시험에 낸다"·"외워라"·"중요" → 굵게+★. 강의 끝에 (암기 불필요) 내용 중 압축정리본·Anki에 이미 들어간 게 있으면 목록으로 알려줘 (내가 카드 정지·삭제).
16. 미니 인출: 요약 체크리스트 다음, 강의록 안 보고 답할 문제 2~3개를 중요·강조 부분에서.
17. 강의 끝: 챕터들을 요약해 전체 흐름 재정리 → 교수 출제 형식·족보 스타일 인출 8~10문제.
18. 문제 규칙: 단답식·객관식 위주, 여러 단계 기전 이해 확인에만 서술형. 족보 실제 출제 방식·형태 반영. 강의록 번호 나열을 그대로 묻는("3번은?") 얕은 문제 금지. 문제 안에서 답을 굵게 하는 등 힌트 노출 금지.
19. 채점: 내가 전부 답하기 전엔 정답·해설 공개 X. 틀린 것만 인과사슬+말투 규칙으로 재설명 후 재출제. "오답만 다시" 요청 시 틀린 개념만 재설명·재출제.
20. 인출세트 끝나면 강의별 정리본 PDF 제작 (인출 문제는 미포함).

### 수시: 족보 해설 제작
21. 문항마다 아래 형식, 그대로 옮겨 적을 수 있게 텍스트로 (파일 X):
   [문항번호] 정답: ○
   - 해설: 정답 근거 인과사슬 1~3줄
   - 오답 선지: 선지별 틀린 이유 한 줄 (객관식)
   - 관련 강의: nn강
22. 복원 족보라 문항·선지가 불완전해 정답 확정이 어려우면 [정답 불확실] + 이유 + 가능한 답 후보. 선배 해설과 판단이 다르면 [선배 해설과 다름] + 근거. 확신 없는 답을 확정처럼 쓰지 마.

### 수시: 작년↔올해 필기 비교
23. PDF 새로 만들지 말고 텍스트로, 순서대로:
   ① 달라진 점·새 강조: 표 (슬라이드 p. | 작년 | 올해 | 출제 의미)
   ② 정리본 수정사항: 표 (정리본 위치(챕터·항목) | 유형(추가/수정/삭제/강조) | 넣을 내용 — 그대로 붙여넣을 수 있는 문장)
   ③ 누락 전수검토: 올해 필기를 첫 슬라이드부터 한 장씩 정리본과 대조해서 빠진 개념·수치·분류·예외를 전부 ②에 포함. 마지막에 대조 완료 범위(p.1~p.N) 명시. 빠진 내용이 하나라도 있으면 안 돼.
   ④ 압축정리본 반영 필요: 새 교수 강조·새 족보 포인트만.

### 짤족 / 탈족
24. 강의록·필기·교수 후기에서 짤족·탈족 언급을 발견하면 반드시 알려줘. 짤족 → 인출 문제에서 족보 문항 비중↑ + 압축정리본·Anki에 없는 족보 포인트 목록 제시. 탈족 → 족보 의존도↓, 개념 이해·응용 문제 강화. 과목 설정의 교수별 학습 전략이 있으면 그 교수 강의에 우선 적용.

### 형식 · 기타
25. 표·불릿·인과사슬 우선, 줄글 최소화. 확인한 내용은 다시 묻지 마.

### 정리본 PDF 형식 (강의별 정리본·압축정리본 공통, 고정)
26. 제목: 문서 첫 줄(대제목)은 'nn강. 강의제목 (교수 이름)' (예: 01강. 총론 (1) (OOO)), 파일명은 'nn강. 강의제목.pdf'. nn은 두 자리(01, 02…). 챕터 제목은 '1.' 형식 ('Ch1.' X).
27. 색상·글꼴: 검정(#000000)·흰색(#FFFFFF)·강조색(#FFF9D6) 세 가지만. 테두리·구분선 전부 검정, 회색 계열 금지. 글꼴은 Pretendard.
28. 크기·위계: 본문 10.3pt / 대제목 17pt / 챕터소제목 12.5pt / 섹션소제목 11pt / 표 본문 9.5pt / 캡션·부가설명(Light) 9pt. Semibold/Light 위계 유지.
29. 간격: 문단 마진 없이 줄 간격 1.15. 서로 다른 블록(표/소제목/인과사슬 박스) 사이에만 최소 여백 1.8~4mm.
30. 기호: 말머리는 하이픈(-) 하나, 번호는 원문자(①②③), 특별 강조는 ★.
31. 표: 얇은 전체 격자 + #FFF9D6 헤더.
32. 챕터소제목: #FFF9D6 배경 + 왼쪽 굵은 검정 세로 바를 함께 사용.
33. 인과사슬: 네 면 박스 X, 왼쪽 세로선만 있는 인용구(blockquote) 스타일. ↓로 줄마다 쌓지 말고 한 문단 안에서 →로 죽 이어지게.
34. 이미지 자리표시: 실제 이미지 X. 세로 60mm 빈 사각형 + 아래 캡션 '[그림 제목(p.강의록 페이지)] 그림 설명' (예: [신호전달 경로 모식도(p.6)] 수용체 결합부터 유전자 발현까지의 단계).
35. 표·인과사슬 박스·이미지 박스·메모 칸은 page-break-inside: avoid.
36. 최대한 압축, 화려한 서식 X. 인출 문제 미포함.
37. 엔진·폰트: WeasyPrint 사용, wkhtmltopdf 금지 (글자 하나하나가 별도 텍스트 객체로 찍혀 PDF-XChange 편집 시 글자 단위로 쪼개짐). Pretendard는 반드시 TTF 버전을 @font-face로 임베딩, OTF/CFF 금지 (★↓①② 등 특수기호가 PDF-XChange에서 깨진 네모로 표시됨).`;
function customInstructionsBase(){
  const v = App.customInstructionDefault;
  return (typeof v==='string' && v.trim().length) ? v : CUSTOM_INSTRUCTIONS_TEMPLATE;
}
function customInstructionsTemplate(){
  const v = App.customInstructionOverride;
  if(typeof v==='string' && v.trim().length) return v;
  return customInstructionsBase();
}
function setCustomInstructionOverride(text){
  const base = customInstructionsBase();
  if(!text || !text.trim().length || text===base){
    App.customInstructionOverride='';
  } else {
    App.customInstructionOverride=text;
  }
  saveApp();
}
function clearCustomInstructionOverride(){ App.customInstructionOverride=''; App.customInstructionDefault=''; saveApp(); }
function saveCustomInstructionAsDefault(text){
  if(!text || !text.trim().length || text===CUSTOM_INSTRUCTIONS_TEMPLATE){
    App.customInstructionDefault='';
  } else {
    App.customInstructionDefault=text;
  }
  App.customInstructionOverride='';
  saveApp();
}
/* 지침의 '과목 설정' 칸을 현재 블록 정보로 자동으로 채운다.
   {과목명}=블록 이름, {시작일}/{시험일}=Day1/시험일, 교수 목록=강의 목록의 교수별 담당 강의,
   교수별 학습 전략=프롬프트 탭 '학습 전략 붙여넣기' 내용(비어 있으면 빈칸). '← 예시' 메모는 떼고 복사된다. */
function professorListText(){
  const map=new Map();
  LEC.filter(l=>l.type!=='과제' && !(S && S.lec[l.id] && S.lec[l.id].excluded)).forEach(l=>{
    const prof=(l.prof||'').trim(); if(!prof || prof==='미정') return;
    if(!map.has(prof)) map.set(prof, []);
    map.get(prof).push(String(l.code||'').trim());
  });
  return [...map.entries()].map(([prof,codes])=>{
    const cs=codes.filter(Boolean);
    const allNum=cs.length && cs.every(c=>/^\d+$/.test(c));
    return cs.length ? `${prof} (${cs.join(', ')}${allNum?'강':''})` : prof;
  }).join(', ');
}
function customInstructions(){
  const block = App.blocks.find(b=>b.id===App.active);
  const subject = block?.name || '{과목명}';
  const reviews = (block?.profReviews || '').trim();
  const fmt = d => d ? `${d.date}(${d.dow})` : null;
  const start = fmt(SCHOOL_DAYS && SCHOOL_DAYS[0]) || '{시작일}';
  const exam = (S && fmt(dInfo(S.examDay))) || '{시험일}';
  const profs = professorListText() || '{교수 이름 (담당 강의 범위)}';
  return customInstructionsTemplate()
    .replace(/^아래 모든 규칙의 \{과목명\}은 위 설정값으로 읽어\.[ \t]*\r?\n?/m, '') // 과목명이 직접 채워지므로 필요 없는 안내 줄
    .replace('{교수 이름 (담당 강의 범위)}', profs)
    .replace(/\{교수 후기 요약[^}]*\}(\s*\(없으면 비워둠\))?/, reviews ? (reviews.includes('\n') ? '\n'+reviews : reviews) : '')
    .replace('__PROFESSOR_REVIEWS__', reviews)
    .replaceAll('{시작일}', start).replaceAll('{시험일}', exam)
    .replaceAll('{과목명}', subject).replaceAll('[과목명]', subject)
    .replace(/[ \t]*←[^\n]*/g, '');
}

/* ===== 부하균형 인출 알고리즘 (실시간 재계산) =====
   각 강의는 시험기간 동안 총 3회독: 신규 → 1차 → 2차. 각 단계의 크레딧(기본 1 / 0.5 /
   0.25)은 "학습 계획" 탭 상단에서 직접 바꿀 수 있다.
   남은 크레딧(= 아직 안 끝난 항목들의 가중치 합) ÷ 남은 분배 일수(오늘부터, 시험 전날·
   당일 제외)가 하루 목표 크레딧의 기준이다. 다만 시험기간 전체의 초반 20%는 목표를
   70%로 낮춰 적응 기간을 두고, 그만큼을 나머지 날짜에 나눠 보정한다(총량은 항상
   보존됨) — 오늘이 이미 그 구간을 지났으면 자동으로 평소(100%) 기준이 적용된다.
   이미 완료한 항목(인코딩·체크 완료)은 계산에서 완전히 빠지고, 오늘부터 남은 것만
   매번 새로 계산한다.

   하루하루를 앞에서부터 시뮬레이션한다. 각 강의의 기본값(목표)은 항상 실제 수업일
   기준으로 고정된다 — 신규=수업일, 1차=수업일+1, 2차=수업일+3. 이 기본값들이 그날그날
   들쭉날쭉 몰리므로, 그날 목표 크레딧에 순서대로 채우다가 넘치면 다음 날로 미루고
   (이월), 오늘 다 채우고도 여유가 남으면 아직 도래하지 않은 항목을 앞당겨 채운다(예습).
   단, 복습은 그 강의의 신규(1차는 신규, 2차는 1차)가 실제로 배정되기 전까지는 배정될 수
   없다 — 신규가 밀리면 그 복습의 목표일도 "기본값과 (실제 신규일+1) 중 더 늦은 날"로
   자동 조정되고, 반대로 신규가 일찍 끝나도 복습은 원래 기본값(수업일+1/+3)보다 앞당겨
   지지 않는다. 이렇게 신규→1차→2차 세 단계가 항상 순서를 지키면서 시험기간 안에 전부
   확정 배정된다.

   하루 목표 크레딧은 각 날짜별로 직접 상향·하향 조정할 수 있다(약속 있는 날은 낮추고,
   몰아서 할 수 있는 날은 올리는 식) — 그러면 다음 계산부터 바로 반영된다. */
function activeLectures(){ return LEC.filter(l=>!S.lec[l.id].excluded); }
function usableDays(){ return Math.max(1, S.examDay-2); } // 시험 당일·전날은 분배 제외
const DEFAULT_TYPE_COST = {new:1, r1:0.5, r2:0.25};
function typeCost(type){ return (S.typeCost && S.typeCost[type]!=null) ? S.typeCost[type] : DEFAULT_TYPE_COST[type]; }
function totalLecCost(){ return typeCost('new')+typeCost('r1')+typeCost('r2'); }
/* 과제는 3단계가 아니라 등록할 때 직접 정한 크레딧 하나로 한 번에 완료된다. */
function itemTotalCost(l){ return l.type==='과제' ? (l.credit>0 ? l.credit : 1) : totalLecCost(); }
function itemCost(it){
  if(it.type==='assign'){ const l=byId(it.lecId); return l ? itemTotalCost(l) : 1; }
  return typeCost(it.type);
}
function remainingCredits(){
  let sum=0;
  activeLectures().forEach(l=>{
    const st=S.lec[l.id];
    if(l.type==='과제'){ if(st.enc==null) sum+=itemTotalCost(l); return; }
    if(st.enc==null) sum+=totalLecCost();
    else sum += (st.r[1]?0:typeCost('r1')) + (st.r[2]?0:typeCost('r2'));
  });
  return sum;
}
function rampDays(){ return Math.max(1, Math.ceil(0.2*usableDays())); }
function dayWeight(d){ return d<=rampDays() ? 0.7 : 1.0; }
/* remainingCred를 fromDay~시험 전날 사이에, 초반 램프 가중치를 반영해서 나눈 값 중
   day d의 몫. 총합은 항상 remainingCred로 보존된다. */
function defaultCapacityFor(d, remainingCred, fromDay){
  const uEnd=usableDays();
  let wsum=0;
  for(let x=fromDay; x<=uEnd; x++) wsum+=dayWeight(x);
  if(wsum<=0) wsum=1;
  return (remainingCred/wsum)*dayWeight(d);
}
/* 오늘 크레딧은 "코인"이다 — 하루가 시작될 때 한 번 정해지면 그날 안에서는 바뀌지
   않는다. 체크(완료)를 해서 코인을 쓰는 것과, 새로 코인이 배정되는 것(=오늘 할 일
   목록이 다시 계산되는 것)은 완전히 별개다. S.todayLock에 "오늘 하기로 확정된 목록"을
   저장해두고, 날짜가 바뀌거나(다음 날로 이동) 시험일·크레딧 상향/하향 조정·시험범위
   제외 같은 "계획 자체를 바꾸는" 조작이 있을 때만 다시 정한다. 단순히 항목을
   완료 체크하는 것으로는 절대 다시 계산되지 않는다.
   재계산이 일어날 때는(예: 크레딧 조정) 오늘 이미 완료한 항목을 "이미 쓴 크레딧"으로
   그대로 포함시키고 남은 예산만 새로 채운다 — 그래서 오늘 1을 이미 했으면 그만큼은
   다른 날과 동일하게가 아니라 정확히 1만큼 덜 배정된다. */
function lockedTodayTotalCost(){
  if(!S.todayLock || S.todayLock.day!==S.cur) return 0;
  return S.todayLock.items.reduce((a,it)=>a+itemCost(it),0);
}
function lockedTodayDoneCost(){
  if(!S.todayLock || S.todayLock.day!==S.cur) return 0;
  let sum=0;
  S.todayLock.items.forEach(it=>{
    const st=S.lec[it.lecId]; if(!st) return;
    let done;
    if(it.type==='r1') done = !!st.r[1];
    else if(it.type==='r2') done = !!st.r[2];
    else done = st.enc!=null; // 'new' 또는 'assign'
    if(done) sum+=itemCost(it);
  });
  return sum;
}
function lockedTodayRemainingCost(){ return Math.max(0, lockedTodayTotalCost()-lockedTodayDoneCost()); }
function futureRemainingCredits(){ return Math.max(0, remainingCredits()-lockedTodayRemainingCost()); }
function dayCapacity(d){
  const uEnd = usableDays();
  if(d<1 || d>uEnd) return 0; // 시험 전날·당일: 분배 대상 아님
  if(S.capOverride && S.capOverride[d]!=null) return S.capOverride[d];
  if(d===S.cur) return (S.todayLock && S.todayLock.day===S.cur) ? lockedTodayTotalCost() : defaultCapacityFor(d, remainingCredits(), S.cur);
  return defaultCapacityFor(d, futureRemainingCredits(), S.cur+1);
}
function buildPendingPool(excludeKeys){
  const pool=[];
  activeLectures().forEach(l=>{
    const st=S.lec[l.id];
    const push=(type,original,cost)=>{ if(excludeKeys && excludeKeys.has(l.id+':'+type)) return; pool.push({type, lecId:l.id, cost:(cost!=null?cost:typeCost(type)), original, nominal:original}); };
    if(l.type==='과제'){ if(st.enc==null) push('assign', l.day, itemTotalCost(l)); return; }
    if(st.enc==null){ push('new',l.day); push('r1',l.day+1); push('r2',l.day+3); }
    else {
      if(!st.r[1]){ push('r1',st.enc+1); if(!st.r[2]) push('r2',st.enc+3); }
      else if(!st.r[2]){ push('r2',st.enc+3); }
    }
  });
  return pool;
}
const TYPE_ORDER={assign:-1,new:0,r1:1,r2:2};
const scheduleSortFn=(a,b)=> a.nominal-b.nominal || TYPE_ORDER[a.type]-TYPE_ORDER[b.type] || a.lecId-b.lecId;
/* 그날 목표 크레딧(cap)이 남아 있는 한(used<cap) 다음 항목을 마저 진행한다 — 정확히
   맞아떨어지지 않아 살짝 넘어가도 OK. 여유가 완전히 없어지면(used>=cap) 그 시점에서
   멈추고 나머지는 전부 다음 날로 이월한다. */
function fillDay(pool, cap){
  pool.sort(scheduleSortFn);
  const placed=[]; let used=0; let i=0;
  for(; i<pool.length; i++){
    if(used >= cap-1e-9) break;
    placed.push(pool[i]); used+=pool[i].cost;
  }
  return {placed, rest:pool.slice(i)};
}
function ensureTodayLock(){
  if(S.todayLock && S.todayLock.day===S.cur){
    Object.entries(S.pulledReviews || {}).forEach(([key,day])=>{
      if(day!==S.cur) return;
      const [lecIdText,type]=key.split(':');
      const lecId=Number(lecIdText);
      if(S.todayLock.items.some(it=>it.lecId===lecId && it.type===type)) return;
      const st=S.lec[lecId];
      if(!st || st.excluded) return;
      const lec=byId(lecId);
      if(!lec) return;
      let original;
      if(type==='new') original = lec.day;
      else if(type==='r1') original = st.enc!=null ? st.enc+1 : null;
      else original = st.enc!=null ? st.enc+3 : null;
      S.todayLock.items.push({type, lecId, original, pulled:true});
    });
    return;
  }
  const uEnd = usableDays();
  if(S.cur<1 || S.cur>uEnd){ S.todayLock = {day:S.cur, items:[]}; return; } // 시험 전날·당일 등 분배 대상 밖
  const pinned=[];
  const pinnedKeys=new Set();
  activeLectures().forEach(l=>{
    const st=S.lec[l.id];
    if(l.type==='과제'){ if(st.enc===S.cur){ pinned.push({type:'assign', lecId:l.id, original:l.day}); pinnedKeys.add(l.id+':assign'); } return; }
    if(st.enc===S.cur){ pinned.push({type:'new', lecId:l.id, original:l.day}); pinnedKeys.add(l.id+':new'); }
    if(st.r[1] && st.rDay && st.rDay[1]===S.cur){ pinned.push({type:'r1', lecId:l.id, original:(st.enc!=null?st.enc+1:l.day+1)}); pinnedKeys.add(l.id+':r1'); }
    if(st.r[2] && st.rDay && st.rDay[2]===S.cur){ pinned.push({type:'r2', lecId:l.id, original:(st.enc!=null?st.enc+3:l.day+3)}); pinnedKeys.add(l.id+':r2'); }
  });
  /* 오늘로 당겨왔지만 아직 완료 전이라 위 실제완료 기준에는 안 걸리는 항목도 그대로
     고정한다 — 안 그러면 크레딧 조정 등으로 오늘 몫이 통째로 다시 계산될 때 당겨온
     항목이 조용히 사라진다. */
  Object.entries(S.pulledReviews || {}).forEach(([key,day])=>{
    if(day!==S.cur || pinnedKeys.has(key)) return;
    const [lecIdText,type]=key.split(':');
    const lecId=Number(lecIdText);
    const l=byId(lecId), st=S.lec[lecId];
    if(!l || !st || st.excluded) return;
    let original;
    if(type==='new') original=l.day;
    else if(type==='r1') original = st.enc!=null ? st.enc+1 : l.day+1;
    else original = st.enc!=null ? st.enc+3 : l.day+3;
    pinned.push({type, lecId, original, pulled:true});
    pinnedKeys.add(key);
  });
  const pinnedCost = pinned.reduce((a,it)=>a+itemCost(it),0);
  const cap = (S.capOverride && S.capOverride[S.cur]!=null) ? S.capOverride[S.cur] : defaultCapacityFor(S.cur, remainingCredits()+pinnedCost, S.cur);
  const pool = buildPendingPool(pinnedKeys);
  const {placed} = fillDay(pool, Math.max(0, cap-pinnedCost));
  S.todayLock = {day:S.cur, items: [...pinned, ...placed].map(it=>({type:it.type, lecId:it.lecId, original:it.original, pulled:!!it.pulled}))};
}
/* 오늘 몫은 S.todayLock을 그대로 쓰고(체크할수록 줄기만 함), 내일부터 시험 전날까지는
   오늘 lock에 들어간 것들을 제외한 나머지로 매번 새로 시뮬레이션한다(이월·예습 반영,
   실제 상태는 건드리지 않는 순수 계산). */
function computeSchedule(){
  ensureTodayLock();
  const uEnd = usableDays(), startDay = S.cur;
  const byDay={}; for(let d=startDay; d<=uEnd; d++) byDay[d]=[];
  if(!byDay[startDay]) byDay[startDay]=[]; // 오늘이 분배 구간 밖이어도(시험 전날 등) 항상 키는 존재하게

  const lockedKeys = new Set();
  S.todayLock.items.forEach(it=>{
    lockedKeys.add(it.lecId+':'+it.type);
    const st=S.lec[it.lecId]; if(!st) return;
    let done;
    if(it.type==='r1') done = !!st.r[1];
    else if(it.type==='r2') done = !!st.r[2];
    else done = st.enc!=null; // 'new' 또는 'assign'
    byDay[startDay].push({type:it.type, lecId:it.lecId, cost:itemCost(it), original:it.original, day:startDay, done, pulled:!!it.pulled});
  });

  let pool = buildPendingPool(lockedKeys);
  for(let d=startDay+1; d<=uEnd; d++){
    const {placed, rest} = fillDay(pool, dayCapacity(d));
    placed.forEach(it=>{ it.day=d; byDay[d].push(it); });
    pool = rest;
  }
  const unscheduled = pool; // 크레딧이 부족하게 조정된 경우에만 남음
  const byLecture={};
  activeLectures().forEach(l=>{ byLecture[l.id]={new:null,r1:null,r2:null,assign:null}; });
  Object.values(byDay).flat().forEach(it=>{ byLecture[it.lecId][it.type]=it.day; });
  return {byDay, byLecture, unscheduled, startDay, uEnd};
}
let SCHEDULE=null; // computeSchedule() 결과 캐시 — render()에서 한 번만 계산해 재사용

function promptBaseText(id, fallback){

function promptOverrideText(id, fallback){

function slots(l){
  const st=S.lec[l.id]; if(st.enc==null) return [];
  const bl = SCHEDULE.byLecture[l.id] || {r1:null,r2:null};
  return [1,2].map(k=>{
    const type = k===1?'r1':'r2';
    return {key:k, label:STAGE_DESC[k].desc, due:bl[type], done:st.r[k]};
  });
}
function preQueue(){
  return activeLectures().filter(l=> l.type!=='과제' && S.lec[l.id].enc==null && SCHEDULE.byLecture[l.id].new!==S.cur)
    .sort((a,b)=>{
      const da=SCHEDULE.byLecture[a.id].new, db=SCHEDULE.byLecture[b.id].new;
      if(da==null && db==null) return a.id-b.id;
      if(da==null) return 1; if(db==null) return -1;
      return da-db || a.id-b.id;
    });
}
/* 오늘 락에 이미 들어간 것 말고, "지금 당장 미리 끝내고 싶은" 복습들을 수동으로 고를
   수 있게 보여준다 — 알고리즘이 여유될 때 자동으로 당겨주는 것과는 별개의 수동 경로.
   pulled 기록은 "오늘 당긴 것"만 목록에서 빼야 한다. 지난 날 당겨놓고 못 끝낸 항목까지
   빼버리면 그 항목은 두 번 다시 당길 수 없게 된다. */
function previewReviewQueue(){
  const lockedKeys = new Set((S.todayLock&&S.todayLock.day===S.cur? S.todayLock.items:[]).map(it=>it.lecId+':'+it.type));
  const pulled = S.pulledReviews || {};
  const out=[];
  activeLectures().forEach(l=>{
    const st=S.lec[l.id];
    if(st.enc==null) return;
    if(!st.r[1] && !lockedKeys.has(l.id+':r1') && pulled[l.id+':r1']!==S.cur) out.push({type:'r1', l});
    else if(st.r[1] && !st.r[2] && !lockedKeys.has(l.id+':r2') && pulled[l.id+':r2']!==S.cur) out.push({type:'r2', l});
  });
  return out.sort((a,b)=>{
    const da=SCHEDULE.byLecture[a.l.id][a.type], db=SCHEDULE.byLecture[b.l.id][b.type];
    if(da==null && db==null) return a.l.id-b.l.id;
    if(da==null) return 1; if(db==null) return -1;
    return da-db || a.l.id-b.l.id;
  });
}

function popMarks(x,y){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    m.style.setProperty('--dx', (Math.random()*46-23).toFixed(1)+'px');
    m.style.animationDelay=(i*45)+'ms';
    m.style.width=m.style.height=(5+Math.random()*4).toFixed(1)+'px';

let _lastFrac = 0;
function renderBanner(){
  const rem = S.examDay - S.cur;
  const refMax = Math.max(S.examDay,1);
  const frac = Math.max(0, Math.min(1, rem/refMax));
  const cx=42, cy=42, R=34, C=2*Math.PI*R;
  const dash = C*frac, gap = C-dash;

  let ringColor, statusLabel;
  let statusColor;
  if(rem<=0){ ringColor='var(--warn)'; statusColor='var(--warn)'; statusLabel= (S.finishedAt && rem===0) ? '완료' : '시험 당일'; }
  else if(rem<=1){ ringColor='var(--warn)'; statusColor='var(--warn)'; statusLabel='내일'; }
  else if(frac<0.34){ ringColor='var(--warn)'; statusColor='var(--warn)'; statusLabel='임박'; }
  else if(frac<0.67){ ringColor='var(--progress)'; statusColor='var(--accent-ink)'; statusLabel='진행 중'; }
  else{ ringColor='var(--inactive)'; statusColor='var(--inactive)'; statusLabel='여유'; }

  /* 링은 항상 "직전에 보여주던 값"에서 출발해 현재 값으로 이어진다. 처음 열 때는 0에서
     차오르고, 이후에는 값이 바뀔 때만 실제로 움직이므로 렌더마다 튀지 않는다. */
  const pd = C*_lastFrac, pg = C-pd;
  const svg = `<svg viewBox="0 0 84 84" width="72" height="72">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="9"/>
    <circle class="gring" cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${ringColor}" stroke-width="9" stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})"
      style="stroke-dasharray:${pd.toFixed(1)} ${pg.toFixed(1)};transition:stroke-dasharray 760ms var(--ease),stroke 240ms linear"/>
  </svg>`;

  let dnum, sub;
  if(rem>1){ dnum=`D-${rem}`; sub='시험까지 남은 날'; }
  else if(rem===1){ dnum='D-1'; sub='내일이 시험이야! 마지막까지 화이팅🍀'; }
  else if(rem===0 && S.finishedAt){ dnum='D-DAY'; sub='블록 끝! 정말 고생 많았어 🎉'; }
  else if(rem===0){ dnum='D-DAY'; sub='오늘 시험이야! 지금까지 열심히 한 것보다도 더 잘 볼거야 🍀🍀🍀'; }
  else{ dnum='FIN'; sub='시험이 끝났어. 그동안 수고했어! 다음 블록도 화이팅!'; }

  const b=document.getElementById('banner');
  b.className='gaugebar';
  b.innerHTML = `${svg}<div class="msg"><span class="dnum">${dnum}</span><small style="color:${statusColor}">${esc(statusLabel)} · ${esc(sub)}</small></div>`;
  if(rem<=1 && rem>=0){
    for(let i=0;i<5;i++){
      const c = el(`<span class="clover" style="right:${6+i*7}%;animation-delay:${i*0.5}s">🍀</span>`);
      b.appendChild(c);
    }
  }
  const ring=b.querySelector('.gring');
  if(ring) requestAnimationFrame(()=>{ ring.style.strokeDasharray=`${dash.toFixed(1)} ${gap.toFixed(1)}`; });
  _lastFrac = frac;
}
/* ===== 배터리 =====
   battLevel(현재 수위) = 표시 퍼센트. 물결은 이 기준선 위아래로만 흔들리고,
   진폭은 0%/100%에 가까워질수록 0으로 줄어든다 → 100%면 물결 없이 정확히 꽉 차고,
   어떤 순간에도 100%를 넘어 보이지 않는다. 값이 움직일 때만 slosh(출렁임)를 실어준다. */
let battLevel=0, battTarget=0, battSlosh=0, batteryWaveFrame=0, battLastT=0;
function battShown(){
  if(battTarget>=99.99) return battLevel>=99.4 ? 100 : Math.floor(battLevel);
  return Math.min(99, Math.round(battLevel));
}
/* 시험 전날 진도 = 그날 카드(전날 체크리스트 + 직접 추가한 계획) 중 완료한 비율.
   그날은 크레딧을 배정하지 않으므로 크레딧 기준 배터리가 의미가 없다. */
function examEveProgress(){
  if(!S.examEve) S.examEve={};
  const items = examEveItems();
  const plans = (S.manualPlans && S.manualPlans[S.cur]) || [];
  return {
    total: items.length + plans.length,
    done: items.filter((_,i)=>!!S.examEve[i]).length + plans.filter(p=>p.done).length,
  };
}
function renderLoadPanel(){
  const isExamEve = (S.examDay-1)>=1 && S.cur===S.examDay-1;
  const blocked = !isExamEve && S.cur>usableDays();
  let total, used, pct, meterText, hint;
  if(isExamEve){
    const prog = examEveProgress();
    total = prog.total; used = prog.done;
    pct = total>0 ? (used/total*100) : 100;
    meterText = `${used} / ${total} (오늘 체크리스트)`;
    if(total===0) hint = `오늘 체크할 항목이 없습니다.`;
    else if(used>=total) hint = `시험 전날 체크리스트 ${total}개를 모두 끝냈습니다.`;
    else hint = `시험 전날 체크리스트 ${total}개 중 ${used}개를 끝냈습니다. ${total-used}개 남았습니다.`;
  } else {
    total = lockedTodayTotalCost();
    const remaining = lockedTodayRemainingCost();
    used = Math.max(0, total-remaining);
    pct = total>0 ? (used/total*100) : 100;
    meterText = `${used.toFixed(2)} / ${total.toFixed(2)} (오늘 크레딧)`;
    if(blocked) hint = ``;
    else if(total<1e-9) hint = `오늘은 배정된 학습이 없습니다.`;
    else if(remaining<1e-9) hint = `오늘 정해진 ${total.toFixed(2)} 크레딧을 모두 완료했습니다.`;
    else hint = `오늘 배정된 크레딧은 ${total.toFixed(2)}입니다. 현재 ${Math.round(pct)}% 완료했으며, ${remaining.toFixed(2)} 크레딧이 남았습니다.`;
  }
  let color, bg, statusText;
  /* color = 배지 글자색(진한 톤), fill = 막대 채움색(중간 톤). 둘을 분리해야
     작은 글자는 또렷하고 넓은 막대는 차분하게 유지된다. */
  let fill;
  if(pct>=100){ color='var(--accent-ink)'; fill='var(--done)'; bg='var(--done-soft)'; statusText='완료'; }
  else if(pct>=1){ color='var(--accent-ink)'; fill='var(--fill-progress)'; bg='var(--progress-soft)'; statusText='진행 중'; }
  else { color='var(--muted)'; fill='var(--inactive-soft)'; bg='var(--inactive-soft)'; statusText='시작 전'; }
  document.getElementById('loadPanel').innerHTML = `
    <h2>오늘의 진도</h2>
    <p class="hint"></p>
    <div class="battery-wrap" style="margin-top:10px">
      <div class="battery"><div class="battery-fill" id="battFill" style="background:linear-gradient(90deg, color-mix(in srgb, ${fill} 55%, #fff), ${fill});background-size:${Math.max(6,battLevel).toFixed(1)}% 100%"></div></div>
      <div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <span class="battery-pct" id="battPct">${battShown()}%</span>
          <span class="badge" style="background:${bg};color:${color}">${statusText}</span>
        </div>
        <div style="font-size:10.5px;color:var(--muted);margin-top:2px">${meterText}</div>
      </div>
    </div>
    <p class="hint" style="margin-top:10px">${esc(hint)}</p>`;
  /* 목표 수위가 바뀐 순간에만 출렁임을 실어, 진도가 오른 만큼 "찰랑이며 차오르게" 한다 */
  const target = Math.max(0, Math.min(100, pct));
  const delta = Math.abs(target-battTarget);
  if(delta>0.3) battSlosh = Math.min(1, battSlosh + 0.28 + Math.min(0.62, delta/26));
  battTarget = target;
  bindBatteryInteraction();
}
function bindBatteryInteraction(){
  const battery=document.querySelector('.battery');
  const fill=battery?.querySelector('#battFill');
  const pctNode=document.getElementById('battPct');
  if(!battery || !fill) return;
  cancelAnimationFrame(batteryWaveFrame);
  const N=14;
  const dent=new Array(N+1).fill(0), dentTarget=new Array(N+1).fill(0);
  const paint=(level, pts)=>{
    fill.style.clipPath = pts
      ? `polygon(0 0,${pts.join(',')},0 100%)`
      : `polygon(0 0,${level}% 0,${level}% 100%,0 100%)`;
    fill.style.backgroundSize = Math.max(6,level).toFixed(1)+'% 100%';
    if(pctNode) pctNode.textContent = battShown()+'%';
  };
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    battLevel=battTarget; battSlosh=0; paint(battLevel, null); return;
  }
  /* 손가락/커서가 수면 근처를 지나가면 그 높이에서 물이 눌린다 */
  battery.addEventListener('pointermove',(event)=>{
    const r=fill.getBoundingClientRect();
    const surfaceX=r.left + r.width*(battLevel/100);
    const prox=Math.max(0,Math.min(1,1-Math.abs(event.clientX-surfaceX)/26));
    const y=(event.clientY-r.top)/r.height;
    for(let i=0;i<=N;i++){
      const p=i/N;
      dentTarget[i]=prox*4.2*Math.exp(-Math.pow((p-y)/0.26,2));
    }
    if(prox>0.05) battSlosh=Math.min(1, battSlosh+prox*0.015);
  });
  battery.addEventListener('pointerleave',()=>dentTarget.fill(0));
  battLastT=0;
  const animateWave=(now)=>{
    const dt = battLastT ? Math.min(0.05,(now-battLastT)/1000) : 0.016;
    battLastT=now;
    battLevel += (battTarget-battLevel)*Math.min(1, dt*4.6);
    if(Math.abs(battTarget-battLevel)<0.05) battLevel=battTarget;
    battSlosh *= Math.exp(-dt*1.45);
    if(battSlosh<0.002) battSlosh=0;
    /* 여유 공간(0%/100%까지의 거리)이 곧 허용 진폭 — 넘칠 수가 없다 */
    const room=Math.min(battLevel, 100-battLevel);
    const amp=Math.min((2.1+6.4*battSlosh)*Math.min(1, room/8), room*0.92);
    const a=now/1900*Math.PI*2, b=now/3100*Math.PI*2, c=now/1150*Math.PI*2;
    const pts=[];
    for(let i=0;i<=N;i++){
      const p=i/N;
      /* 주기가 서로 안 맞는 세 파형을 겹쳐 반복 없이 일렁이게 한다 */
      const w = 0.58*Math.sin(a+p*2.4)
              + 0.27*Math.sin(b-p*1.6+1.1)
              + 0.15*Math.sin(c+p*4.1+0.4);
      dent[i] += (dentTarget[i]-dent[i])*Math.min(1, dt*9);
      const x=Math.max(0, Math.min(100, battLevel + amp*w - dent[i]));
      pts.push(`${x.toFixed(2)}% ${(p*100).toFixed(1)}%`);
    }
    paint(battLevel, pts);
    batteryWaveFrame=requestAnimationFrame(animateWave);
  };
  batteryWaveFrame=requestAnimationFrame(animateWave);
}
/* 760ms 동안 from→to를 --ease와 같은 곡선으로 훑어 표시한다 */
function countUp(node, from, to, dur){
  if(!node) return;
  if(Math.abs(to-from) < 0.5 || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)){
    node.textContent = Math.round(to)+'%'; return;
  }
  const t0=performance.now();
  const step=(now)=>{
    const k=Math.min(1,(now-t0)/dur);
    const e=1-Math.pow(1-k,5);
    node.textContent = Math.round(from+(to-from)*e)+'%';
    if(k<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
/* ===== 학습 계획 (전체 블록 일일 예측) =====

   원래 수업일(이미 지난 경우 오늘)에 인코딩된다고 가정해 나머지 일정을 채워본다.
   실제 상태는 건드리지 않는 시뮬레이션이라 매번 새로 계산해도 안전하다. */
function encCard(l){

  if(isToday){
    if(plannedDay>l.day){ badge=`<span class="badge carry">이월·원래 Day${l.day}</span>`; leftColor='var(--warn)'; }
