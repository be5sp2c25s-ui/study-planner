  } else {
    badge = plannedDay!=null ? `<span class="badge due">Day${plannedDay} 예정</span>` : `<span class="badge carry">배정 못함</span>`;
  }
  const c = el(`<div class="card" style="border-left:4px solid ${leftColor}">
    <div class="top"><span class="code">${esc(l.code)}</span>
      ${l.type==='실습'?'<span class="badge lab">실습</span>':''}
      ${badge}
    </div>
    <div class="t">${esc(l.title)}</div>
    <div class="m">${esc(l.prof)} · ${d.date}(${d.dow})</div>
    <button class="go amber compact pull">오늘로 당기기</button>

  </div>`);
  c.querySelector('.pull').onclick=()=>{
    if(!S.pulledReviews) S.pulledReviews={};

    ensureTodayLock();
    const alreadyLocked=S.todayLock.items.some(it=>it.lecId===l.id && it.type==='new');
    if(!alreadyLocked){
      const original=SCHEDULE.byLecture[l.id] ? SCHEDULE.byLecture[l.id].new : null;

function bindPreviewDetailMotion(){

          detail.open=false;

      }
    });

/* ===== 오늘 할 일: 단계별 서브체크리스트가 딸린 세로 리스트 카드 =====

function flowCard(type, l, isPulled){

  const flowKey=`${App.active}:${type}:${l.id}`;
  const doneCount = steps.filter((_,i)=>sc[i]).length;
  const titleText = isAssign ? esc(l.title) : `${esc(l.code)}. ${esc(l.title)}`;

      <span class="flowtitle">${titleText}<span class="flowmeta">${steps.length? `${doneCount}/${steps.length} 체크됨` : (isAssign?`크레딧 ${l.credit||1}`:'')}${isPulled?' · <span class="pulledtag">미리 당겨옴</span>':''}</span></span>
      ${isPulled?'<button class="unpullbtn" title="오늘로 당긴 것을 취소하고 원래대로 되돌립니다">당김 취소</button>':''}
      ${promptList.length?`<button class="flowpromptbtn" type="button">프롬포트 복사${promptList.length>1?` <span class="ppcount">${promptList.length}</span>`:''}</button>`:''}
      <button class="flowdone ${done?'done':''}" style="${done?'background:var(--inactive-soft);color:var(--inactive)':''}">${done?'완료됨':'완료'}</button>
    </div>
    <div class="promptpick" style="display:none"></div>
    <div class="flowbody${expandedFlowCards.has(flowKey)?' open':''}" style="display:${expandedFlowCards.has(flowKey)?'block':'none'}"></div>
  </div>`);
  const body = item.querySelector('.flowbody');
  steps.forEach((label2, i)=>{
    const row = el(`<div class="substep"><span class="schk ${sc[i]?'done':''}">${sc[i]?'✓':''}</span><span class="slabel ${sc[i]?'done':''}">${esc(label2)}</span></div>`);
    row.style.animationDelay=`${i*45}ms`;

      sc[i] = !sc[i];

    };
    body.appendChild(row);
  });
  const promptBtn=item.querySelector('.flowpromptbtn');
  const pick=item.querySelector('.promptpick');
  if(promptBtn && promptList.length===1){
    promptBtn.onclick=e=>{ e.stopPropagation(); copyText(promptList[0].text, promptBtn); };
  } else if(promptBtn){
    /* 이 단계에 묶인 프롬프트가 여러 개면 목록으로 펼쳐, 이름을 보고 고르게 한다 */
    promptList.forEach((pp,i)=>{
      const r=el(`<button class="ppitem" type="button"><span class="ppnum">${i+1}.</span><span class="ppname">${esc(pp.name)}</span></button>`);
      r.onclick=ev=>{
        ev.stopPropagation();
        const label=promptBtn.innerHTML;
        copyText(pp.text, promptBtn);
        closePick();
        setTimeout(()=>{ promptBtn.innerHTML=label; }, 1500); // copyText가 되돌려 놓는 라벨에 개수 배지를 다시 붙인다
      };
      pick.appendChild(r);
    });
    const closePick=()=>{
      if(pick.style.display==='none') return;
      clearTimeout(pick.closeTimer);
      pick.classList.remove('open','opening');
      pick.classList.add('closing');
      [...pick.children].forEach((r,i)=>{ r.style.animationDelay=`${(pick.children.length-1-i)*40}ms`; });
      pick.closeTimer=setTimeout(()=>{ pick.style.display='none'; pick.classList.remove('closing'); }, 280+pick.children.length*40);
    };
    promptBtn.onclick=e=>{
      e.stopPropagation();
      const open = pick.style.display!=='none' && !pick.classList.contains('closing');
      if(open){ closePick(); return; }
      clearTimeout(pick.closeTimer);
      pick.style.display='block';
      pick.classList.remove('closing');
      pick.classList.add('open','opening');
      [...pick.children].forEach((r,i)=>{ r.style.animationDelay=`${i*40}ms`; });
      setTimeout(()=>pick.classList.remove('opening'), 330);
    };
  }
  if(steps.length){
    item.querySelector('.flowhead').addEventListener('click', (e)=>{
      if(e.target.closest('.flowdone,.unpullbtn,.flowpromptbtn')) return;
      toggleFlowBody(body, ()=>expandedFlowCards.add(flowKey), ()=>expandedFlowCards.delete(flowKey));
    });
  }
  item.querySelector('.flowdone').onclick=(e)=>{
    e.stopPropagation();
    if(type==='new'||isAssign){ st.enc=done ? null : S.cur; }
    else { const key=type==='r1'?1:2; st.r[key]=!done; if(!st.rDay) st.rDay={1:null,2:null}; st.rDay[key]=st.r[key] ? S.cur : null; }
    saveApp(); render();
  };
  const unpullBtn = item.querySelector('.unpullbtn');
  if(unpullBtn) unpullBtn.onclick=(e)=>{
    e.stopPropagation();
    if(S.pulledReviews) delete S.pulledReviews[l.id+':'+type];
    if(S.todayLock && S.todayLock.day===S.cur){
      S.todayLock.items=S.todayLock.items.filter(it=>!(it.lecId===l.id && it.type===type && it.pulled));
    }
    if(type==='new'||isAssign){ st.enc=null; }
    else {
      const key=type==='r1'?1:2;
      st.r[key]=false;
      if(!st.rDay) st.rDay={1:null,2:null};
      st.rDay[key]=null;
    }
    saveApp(); render();
    showToast('오늘로 당긴 걸 취소했습니다.');
  };
  return item;
}
function manualPlanCard(plan){
  const flowKey=`${App.active}:manual:${plan.id}`;
  const steps=Array.isArray(plan.steps) ? plan.steps : [];
  const checks=Array.isArray(plan.checks) ? plan.checks : (plan.checks=[]);
  const done=!!plan.done;
  const item=el(`<div class="flowitem">
    <div class="flowhead">
      <span class="flowbadge" style="background:var(--accent-soft);color:var(--accent-ink)">${esc(plan.badge)}</span>
      <span class="flowtitle">${esc(plan.title)}<span class="flowmeta">${checks.filter(Boolean).length}/${steps.length} 체크됨</span></span>
      <button class="manualdelbtn" title="추가한 계획 삭제">삭제</button>
      <button class="flowdone ${done?'done':''}" style="${done?'background:var(--inactive-soft);color:var(--inactive)':''}">${done?'완료됨':'완료'}</button>
    </div>

    const row=el(`<div class="substep"><span class="schk ${checks[index]?'done':''}">${checks[index]?'✓':''}</span><span class="slabel ${checks[index]?'done':''}">${esc(step)}</span></div>`);

      e.stopPropagation(); checks[index]=!checks[index]; saveApp(); render();
    };

  });

    if(e.target.closest('.flowdone,.manualdelbtn')) return;

    toggleFlowBody(body, ()=>expandedFlowCards.add(flowKey), ()=>expandedFlowCards.delete(flowKey));
  };
  item.querySelector('.flowdone').onclick=e=>{
    e.stopPropagation(); plan.done=!plan.done; saveApp(); render();

    e.stopPropagation();
    askConfirm(`"${plan.title}" 계획을 삭제하시겠습니까?`, '추가한 계획과 체크 기록이 삭제됩니다.', ()=>{

function launchConfetti(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cs=getComputedStyle(document.documentElement);
  const colors=[cs.getPropertyValue('--accent'), cs.getPropertyValue('--fill-progress'), cs.getPropertyValue('--done-soft'), '#F4C95D', '#EE9BB4', '#7CC9A2'].map(c=>c.trim()).filter(Boolean);
  const wrap=document.createElement('div'); wrap.className='confetti';
  for(let i=0;i<90;i++){
    const p=document.createElement('i');
    p.style.left=(Math.random()*100)+'vw';
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*0.6)+'s';
    p.style.animationDuration=(2.2+Math.random()*1.4)+'s';
    p.style.setProperty('--dx', ((Math.random()-0.5)*30)+'vw');
    p.style.setProperty('--rot', (Math.random()*720-360)+'deg');
    if(Math.random()<0.35){ p.style.width='7px'; p.style.height='7px'; p.style.borderRadius='50%'; }
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 4200);
}

  const manualPlans=S.manualPlans[S.cur] || (S.manualPlans[S.cur]=[]);
  const scheduled = (SCHEDULE.byDay[S.cur]||[]).slice();
  const scheduledKeys = new Set(scheduled.map(it=>it.lecId+':'+it.type));
  /* 당겨온 항목은 S.pulledReviews에서 직접 읽으므로, 그 사이 강의가 삭제되거나
     시험범위에서 제외됐을 수 있다 — 걸러내지 않으면 byId()가 undefined를 반환해
     flowCard에서 화면 전체가 깨진다. */
  const pulled = Object.entries(S.pulledReviews)
    .filter(([k,day])=> day===S.cur)
    .map(([k])=>{ const [lecId,type]=k.split(':'); return {lecId:Number(lecId), type, pulled:true}; })
    .filter(p=> byId(p.lecId) && S.lec[p.lecId] && !S.lec[p.lecId].excluded)
    .filter(p=>!scheduledKeys.has(p.lecId+':'+p.type));
  const items = scheduled.concat(pulled).sort((a,b)=>{
    const aDone=(a.type==='new'||a.type==='assign') ? S.lec[a.lecId].enc!=null : !!S.lec[a.lecId].r[a.type==='r1'?1:2];
    const bDone=(b.type==='new'||b.type==='assign') ? S.lec[b.lecId].enc!=null : !!S.lec[b.lecId].r[b.type==='r1'?1:2];
    return Number(aDone)-Number(bDone) || TYPE_ORDER[a.type]-TYPE_ORDER[b.type] || a.lecId-b.lecId;
  });
  box.appendChild(el('<button class="add-plan-btn" type="button">+ 오늘 계획 추가</button>'));
  const isDone = it => (it.type==='new'||it.type==='assign') ? S.lec[it.lecId].enc!=null : !!S.lec[it.lecId].r[it.type==='r1'?1:2];
  items.filter(it=>!isDone(it)).forEach(it=> box.appendChild(flowCard(it.type, byId(it.lecId), it.pulled)));
  manualPlans.filter(plan=>!plan.done).forEach(plan=> box.appendChild(manualPlanCard(plan)));
  dailyItems().forEach((label,i)=> box.appendChild(dailyFlowCard(label,i)));
  items.filter(isDone).forEach(it=> box.appendChild(flowCard(it.type, byId(it.lecId), it.pulled)));
  manualPlans.filter(plan=>plan.done).forEach(plan=> box.appendChild(manualPlanCard(plan)));
  if(!items.length && !manualPlans.length) box.insertBefore(el('<div class="empty">오늘 배정된 신규·복습 없음</div>'),box.children[1]);
  box.querySelector('.add-plan-btn').onclick=openManualPlanModal;
}

/* 블록 사전 준비: 네이티브 <details> 토글을 가로채,
   '오늘 학습 계획'의 상세 체크리스트와 같은 방식으로 펼치고 접는다. */
function bindOnboardMotion(onboard){
  const summary=onboard.querySelector('summary');
  const list=onboard.querySelector('.onboard-list');
  if(!summary || !list) return;
  summary.addEventListener('click', e=>{
    if(e.target.closest('.onboard-close')) return;
    e.preventDefault();
    const rows=[...list.children];
    const opening = !onboard.open || onboard.classList.contains('motion-closing');
    clearTimeout(onboard.closeTimer);
    if(opening){
      onboard.open=true;
      onboard.classList.remove('motion-closing');
      onboard.classList.add('motion-open');
      rows.forEach((row,i)=>{ row.style.animationDelay=`${i*35}ms`; });
    }else{
      onboard.classList.remove('motion-open');
      onboard.classList.add('motion-closing');
      rows.forEach((row,i)=>{ row.style.animationDelay=`${(rows.length-1-i)*35}ms`; });
      onboard.closeTimer=setTimeout(()=>{
        onboard.open=false;
        onboard.classList.remove('motion-closing');
      }, 280+rows.length*35);
    }
  });
}

function slotChip(l, slot){
  const cls = slot.done ? 'done' : (slot.due==null ? 'na' : (slot.due===S.cur ? 'due' : 'inactive'));
  const label = slot.key;
  const title = `${slot.key}차: ${STAGE_DESC[slot.key].desc}` + (slot.due!=null? ` (예정 Day${slot.due})` : (slot.done? '' : ' — 남은 기간 안에 배정하지 못했습니다.'));
  const clickable = S.lec[l.id].enc!=null && (slot.done || slot.due===S.cur);
  if(clickable){
    const b = el(`<button class="${cls}" title="${title}">${label}</button>`);
    b.onclick=()=>{
      const nv = !S.lec[l.id].r[slot.key];
      S.lec[l.id].r[slot.key] = nv;
      if(!S.lec[l.id].rDay) S.lec[l.id].rDay={1:null,2:null};
      S.lec[l.id].rDay[slot.key] = nv ? S.cur : null;
      saveApp(); render();
    };
    return `<div class="chip">${b.outerHTML}<span class="lbl">${slot.key}</span></div>`;
  }
  return `<div class="chip"><span class="sq ${S.lec[l.id].enc==null?'inactive':cls}" title="${title}"></span><span class="lbl">${slot.key}</span></div>`;
}

function renderTypeCostInputs(){

function tagGroupsHtml(items, isDoneFn){
  const groups={assign:[], new:[], r1:[], r2:[]};
  items.forEach(it=>{ if(groups[it.type]) groups[it.type].push(it); });
  const labels={assign:'과제',new:'신규',r1:'1차',r2:'2차'};
  let html='';
  ['assign','new','r1','r2'].forEach(type=>{
    if(!groups[type].length) return;
    const cells = groups[type].map(it=>{
      const l=byId(it.lecId); if(!l) return '';
      const done = isDoneFn ? isDoneFn(it) : false;
      const tip = `${esc(l.title||'')}${done?' · 완료':''}`;
      return `<span class="plancell ${done?'done':''}" title="${tip}">${esc(l.code || l.title)}</span>`;
    }).join('');
    html += `<div class="plantaggrp"><span class="glbl">${labels[type]}</span><span class="planstrip ${type}">${cells}</span></div>`;
  });
  return html? `<div class="plantags">${html}</div>` : '';
}
function renderPlan(){
  renderTypeCostInputs();
  const box=document.getElementById('planList'); box.innerHTML='';
  const warnEl=document.getElementById('planWarn');
  const uEnd=usableDays();
  if(SCHEDULE.unscheduled.length){
    const names = SCHEDULE.unscheduled.slice(0,6).map(it=>{
      const l=byId(it.lecId); const kind = it.type==='assign'?'과제':(it.type==='new'?'신규':(it.type==='r1'?'1차':'2차'));
      return `${l.code||l.title}(${kind})`;
    }).join(', ');
    warnEl.innerHTML = `<p class="hint" style="color:var(--ink);font-weight:700">⚠ 남은 시험기간 안에 다 못 채운 항목이 ${SCHEDULE.unscheduled.length}개 있습니다. (${esc(names)}${SCHEDULE.unscheduled.length>6?' 외':''}). 하루 목표 크레딧을 올리거나 시험범위를 조정해야합니다.</p>`;
    warnEl.style.display='';
  } else { warnEl.style.display='none'; warnEl.innerHTML=''; }

  let scale=0.01;
  for(let d=S.cur; d<=S.examDay; d++){
    const load = d===S.cur ? lockedTodayTotalCost() : (SCHEDULE.byDay[d]||[]).reduce((a,it)=>a+it.cost,0);
    scale=Math.max(scale, load, dayCapacity(d));
  }
  scale*=1.08;

  for(let d=S.cur; d<=S.examDay; d++){
    const info=dInfo(d);
    const cap=dayCapacity(d);
    const blocked = d>uEnd;
    const isToday = d===S.cur;
    const cls = isToday?'cur':'';
    let barHtml, tagsHtml, n=0, r1=0, r2=0, assign=0;

    if(isToday){
      const total=lockedTodayTotalCost(), done=lockedTodayDoneCost(), remaining=Math.max(0,total-done);
      const donePct=Math.min(100, done/scale*100);
      const remPct=Math.min(100-donePct, remaining/scale*100);
      const capPct=Math.min(100, cap/scale*100);
      barHtml = `<div class="pbarwrap"><div class="pbar2">
        <div class="pbarseg" style="width:${donePct}%;background:var(--fill-done)"></div>
        <div class="pbarseg" style="width:${remPct}%;background:var(--fill-progress)"></div>
      </div><div class="pcapline" style="left:${capPct}%"></div></div>`;
      const items = S.todayLock.items;
      n=items.filter(it=>it.type==='new').length; r1=items.filter(it=>it.type==='r1').length; r2=items.filter(it=>it.type==='r2').length; assign=items.filter(it=>it.type==='assign').length;
      tagsHtml = tagGroupsHtml(items, it=>{
        const st=S.lec[it.lecId]; if(!st) return false;
        if(it.type==='new'||it.type==='assign') return st.enc!=null;
        if(it.type==='r1') return !!st.r[1];
        return !!st.r[2];
      });
    } else {
      const items = SCHEDULE.byDay[d]||[];
      const load = items.reduce((a,it)=>a+it.cost,0);
      const loadPct=Math.min(100, load/scale*100);
      const capPct=Math.min(100, cap/scale*100);
      /* 막대는 중간 톤으로 — 과부하만 채도를 올려 눈에 걸리게 한다 */
      let color = blocked? 'var(--inactive-soft)' : (load>cap+1e-9?'var(--fill-warn)':'var(--fill-progress)');
      if(load<1e-9 && !blocked) color='var(--inactive-soft)';
      barHtml = `<div class="pbarwrap"><div class="pbar" style="width:${loadPct}%;background:${color}"></div><div class="pcapline" style="left:${capPct}%"></div></div>`;
      n=items.filter(it=>it.type==='new').length; r1=items.filter(it=>it.type==='r1').length; r2=items.filter(it=>it.type==='r2').length; assign=items.filter(it=>it.type==='assign').length;
      tagsHtml = tagGroupsHtml(items, null);
    }

    const isOverridden = !!(S.capOverride && S.capOverride[d]!=null);
    const capInput = blocked? '' : `<input type="number" step="0.25" min="0" class="capinput${isOverridden?' overridden':''}" data-day="${d}" value="${cap.toFixed(2)}" title="${isOverridden?'직접 조정한 값입니다':'자동 계산된 값입니다'}">${isOverridden?`<button class="capreset" type="button" title="자동 계산값으로 되돌리기">↺</button>`:''}`;
    /* 개수는 낱개 배지로 띄워 간격을 벌리고, 크레딧 조정은 오른쪽 아래로 내린다 */
    const countCells = [
      assign? {k:'과제', v:assign, c:'assign'} : null,
      {k:'신규', v:n, c:'new'}, {k:'1차', v:r1, c:'r1'}, {k:'2차', v:r2, c:'r2'},
    ].filter(Boolean).map(x=>`<span class="pcnt ${x.c}${x.v?'':' zero'}"><i>${x.k}</i><b>${x.v}</b></span>`).join('');
    const row = el(`<div class="planrow ${cls}">
      <div class="pd">Day${d}<div class="pdate">${info.date}(${info.dow})</div></div>
      <div>
        ${barHtml}
        ${tagsHtml}
        ${blocked?`<div class="pnote">분배 제외${info.note?' · '+esc(info.note):''}</div>`:(info.note?`<div class="pnote">${esc(info.note)}</div>`:'')}
      </div>
      <div class="pside">
        <div class="pcount">${countCells}</div>
        ${blocked?'':`<div class="capbox"><span class="caplbl">크레딧</span>${capInput}</div>`}
      </div>
    </div>`);
    if(!blocked){
      row.querySelector('.capinput').addEventListener('change', e=>{
        const v=parseFloat(e.target.value);
        if(!S.capOverride) S.capOverride={};
        if(isNaN(v) || v<0) delete S.capOverride[d]; else S.capOverride[d]=v;
        if(d===S.cur) S.todayLock=null; // 오늘 크레딧 자체를 바꿨으니 오늘 몫도 다시 정한다(이미 완료한 건 보존)
        saveApp(); render();
      });
      const resetBtn=row.querySelector('.capreset');
      if(resetBtn) resetBtn.onclick=()=>{
        if(S.capOverride) delete S.capOverride[d];
        if(d===S.cur) S.todayLock=null;
        saveApp(); render();
      };
    }
    box.appendChild(row);
  }
}

function buildAssignRow(l, st){
  const excluded = !!st.excluded;
  const done = st.enc!=null;
  const due = SCHEDULE.byLecture[l.id] ? SCHEDULE.byLecture[l.id].assign : null;
  const cls = done ? 'done' : (due==null ? 'na' : (due===S.cur ? 'due' : 'inactive'));
  const chipTitle = done ? `완료됨 (Day${st.enc})` : (`크레딧 ${l.credit||1}` + (due!=null? ` · 예정 Day${due}` : ' — 배정 못함'));

  if(!st.subCheck.assign) st.subCheck.assign={};
  const sc = st.subCheck.assign;
  const checkedCount = checklist.filter((_,i)=>sc[i]).length;

  const chipsHtml = excluded ? '' : `<div class="chips"><div class="chip">${clickable?`<button class="assign-complete-btn ${cls}" title="${esc(chipTitle)}">완</button>`:`<span class="sq ${cls}" title="${esc(chipTitle)}"></span>`}<span class="lbl">과제</span></div></div>`;

    ${chipsHtml}
    ${excluded?'':`<span class="encpill ${done?'':'no'}">${done?'완료 D'+st.enc:'미완료'}</span>`}
    ${checklist.length?`<button class="undo assign-checklist-toggle">체크리스트 ${checkedCount}/${checklist.length}</button>`:''}
    ${(!excluded && done)?'<button class="undo undo-enc">되돌리기</button>':''}
    <button class="undo edit-lec">수정</button>
    <button class="undo excl-toggle">${excluded?'포함시키기':'제외'}</button>
    <button class="tabdel del-lec" title="과제 삭제">×</button>
  </div>`);
  wrap.appendChild(row);

  if(clickable){
    row.querySelector('.assign-complete-btn').onclick=()=>{ st.enc = done? null : S.cur; saveApp(); render(); };
  }
  if(!excluded && done){
    row.querySelector('.undo-enc').onclick=()=> askConfirm(`"${l.title}" 완료를 취소하시겠습니까?`, '이 과제는 다시 미완료 상태가 됩니다.', ()=>{

    });

  row.querySelector('.edit-lec').onclick=()=> openEditLecModal(l);
  row.querySelector('.del-lec').onclick=()=>{
    askConfirm(`"${l.title}"을 완전히 삭제하시겠습니까?`, '과제 자체가 사라지고 완료·체크 기록도 함께 없어지며 되돌릴 수 없습니다.', ()=>{
      const idx=LEC.findIndex(x=>x.id===l.id); if(idx>=0) LEC.splice(idx,1);
      delete S.lec[l.id];
      purgePulled(l.id); // 남아 있으면 오늘 목록 렌더에서 없는 강의를 그리려다 깨진다
      S.todayLock=null;
      saveApp(); render();
    }, '삭제');
  };
  row.querySelector('.excl-toggle').onclick=()=>{
    if(excluded){ st.excluded=false; S.todayLock=null; saveApp(); render(); }
    else askConfirm(`"${l.title}"을 제외하시겠습니까?`, '이 과제는 크레딧 분배 대상에서 제외됩니다.', ()=>{
      st.excluded=true; purgePulled(l.id); S.todayLock=null; saveApp(); render();
    }, '제외');
  };

  if(checklist.length){
    const body = el(`<div class="flowbody" style="border-top:1px solid var(--line);padding:8px 16px 10px 16px;display:none"></div>`);

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(e2){} document.body.removeChild(ta);
  }
  btn.textContent='프롬포트 복사됨'; btn.classList.add('copied');
  showToast('클립보드에 복사됨');
  setTimeout(()=>{ btn.textContent='프롬포트 복사'; btn.classList.remove('copied'); }, 1400);
}

function dateInputValue(value){
  if(/^\d{4}-\d{2}-\d{2}$/.test(value||'')) return value;
  const match=String(value||'').match(/^(\d+)\/(\d+)/);
  return match ? `${new Date().getFullYear()}-${String(match[1]).padStart(2,'0')}-${String(match[2]).padStart(2,'0')}` : '';
}

function buildSchoolDays(startStr, examStr, examLabel){
  const start=new Date(startStr+'T00:00:00'), exam=new Date(examStr+'T00:00:00');
  const dows=['일','월','화','수','목','금','토'];
  const days=[]; let idx=1;
  for(let d=new Date(start); d<=exam; d.setDate(d.getDate()+1)){
    const isExam = d.getTime()===exam.getTime();
    const dow = dows[d.getDay()];
    const isWeekend = d.getDay()===0||d.getDay()===6;
    days.push({day:idx++, date:`${d.getMonth()+1}/${d.getDate()}`, dow, note: isExam? `${examLabel} 시험` : (isWeekend?'주말·캐치업':'')});
  }
  return days;
}

  if(new Date(examStr) < new Date(startStr)){ statusEl.textContent='시험일이 시작일보다 빠릅니다.'; return; }
  const schoolDays = buildSchoolDays(startStr, examStr, subject);

  const isAssign = _editingLec.type==='과제';
  const title=document.getElementById('elTitle').value.trim();
  if(!title){ showToast(isAssign?'과제명을 입력해주세요':'강의명을 입력해주세요'); return; }
  _editingLec.title = title;
  _editingLec.day = parseInt(document.getElementById('elDay').value);
  if(isAssign){
    const credit=parseFloat(document.getElementById('elCredit').value);
    _editingLec.credit = (isNaN(credit)||credit<=0) ? 1 : credit;
    _editingLec.checklist = parseChecklist(document.getElementById('elChecklist').value);
  } else {
    _editingLec.code = document.getElementById('elCode').value.trim() || _editingLec.code;
    _editingLec.prof = document.getElementById('elProf').value.trim() || '미정';
    _editingLec.type = document.getElementById('elType').value;
  }
  S.todayLock=null; // 정보가 바뀌었으니 오늘 몫도 다시 정한다
  saveApp();
  closeEditLecModal();
  render();
};

/* ===== 수동 강의/과제 추가 (보정용) ===== */
const alTypeEl=document.getElementById('alType');
function syncAddLecFields(){
  const isAssign = alTypeEl.value==='과제';
  document.getElementById('alCode').style.display = isAssign?'none':'';
  document.getElementById('alProf').style.display = isAssign?'none':'';
  document.getElementById('alCredit').style.display = isAssign?'':'none';
  document.getElementById('alChecklist').style.display = isAssign?'':'none';
  document.getElementById('alTitle').placeholder = isAssign?'과제명':'강의명';
  document.getElementById('alAdd').textContent = isAssign? '+ 과제 추가' : '+ 강의 추가';
}
alTypeEl.addEventListener('change', syncAddLecFields);
syncAddLecFields();
document.getElementById('alAdd').onclick=()=>{
  const type=document.getElementById('alType').value;
  const title=document.getElementById('alTitle').value.trim();
  const day=parseInt(document.getElementById('alDay').value);
  if(!title){ showToast(type==='과제'?'과제명을 입력해주세요':'강의명을 입력해주세요'); return; }
  const newId = (LEC.reduce((m,l)=>Math.max(m,l.id),0))+1;
  if(type==='과제'){
    const credit=parseFloat(document.getElementById('alCredit').value);
    const checklist=parseChecklist(document.getElementById('alChecklist').value);
    LEC.push({id:newId, day, code:'', title, prof:'', type:'과제', credit:(isNaN(credit)||credit<=0)?1:credit, checklist});
    document.getElementById('alChecklist').value='';
    document.getElementById('alCredit').value='';
  } else {
    const code=document.getElementById('alCode').value.trim();
    const prof=document.getElementById('alProf').value.trim();
    LEC.push({id:newId, day, code:code||`강${newId}`, title, prof:prof||'미정', type});
    document.getElementById('alCode').value=''; document.getElementById('alProf').value='';
  }
  S.lec[newId]=freshLecState();
  S.todayLock=null; // 항목이 늘었으니 오늘 몫도 다시 정한다
  document.getElementById('alTitle').value='';
  saveApp(); render();
};

/* ===== 단계별 크레딧 조정 ===== */
[['tcNew','new'],['tcR1','r1'],['tcR2','r2']].forEach(([id,key])=>{
  document.getElementById(id).addEventListener('change', e=>{
    const v=parseFloat(e.target.value);
    if(isNaN(v) || v<0 || !S) return;
    if(!S.typeCost) S.typeCost={new:1,r1:0.5,r2:0.25};
    S.typeCost[key]=v;
    S.todayLock=null;
    saveApp(); render();
  });
});
document.getElementById('resetOverrides').onclick=()=>{
  if(!S) return;
  askConfirm('전체 크레딧 재분배', '지금까지 개별 날짜에 손댄 크레딧 조정을 전부 지우고, 현재 단계별 크레딧·남은 강의 기준으로 다시 고르게 나눕니다. 이미 완료한 항목은 그대로 유지되고 오늘 몫도 이 기준으로 다시 정해집니다.', ()=>{
    S.capOverride={};
    S.todayLock=null;
    saveApp(); render();
  }, '재분배');
};

/* ===== 컨트롤 ===== */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a;
  if(!S) return;
  if(a==='today'){
    const block=App.blocks.find(b=>b.id===App.active);
    const startStr=block && dateInputValue(block.startDate || block.schoolDays[0]?.date);
    if(!startStr){ showToast('블록 시작일 정보가 없어 오늘로 이동할 수 없습니다.'); return; }
    const start=new Date(startStr+'T00:00:00');
    const now=new Date(); const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const diff=Math.round((today-start)/86400000)+1; // 시작일이 Day1
    const target=Math.min(MAXDAY, Math.max(1, diff));
    if(target===S.cur){ showToast(`이미 오늘(Day${target})입니다.`); return; }
    S.cur=target; S.todayLock=null;
    if(diff<1) showToast(`블록 시작 전입니다 — Day1로 이동했습니다.`);
    else if(diff>MAXDAY) showToast(`블록 종료 후입니다 — 마지막 Day${MAXDAY}로 이동했습니다.`);
    else showToast(`오늘(Day${target})로 이동했습니다.`);
  }
  else if(a==='day-'&&S.cur>1){ S.cur--; S.todayLock=null; }
  /* 날짜를 옮기면 오늘 몫은 항상 다시 정한다(=todayLock 해제). 미리보기로 계산해둔
     SCHEDULE.byDay[내일]을 그대로 굳혀서 쓰면 안 된다 — 그 미리보기는 "오늘 몫을 전부
     끝냈다"고 가정하고 오늘 항목을 빼놓은 시뮬레이션이라, 오늘 못 끝낸 항목이 내일로
     이월되지 않고 사라진다. ensureTodayLock()이 실제 완료 상태를 보고 다시 채워야
     이월·예습이 정상 반영된다. */
  else if(a==='day+'&&S.cur<MAXDAY){ S.cur++; S.todayLock=null; }
  else if(a==='exam-'&&S.examDay>1&&S.examDay>S.cur){ S.examDay--; S.todayLock=null; }
  else if(a==='exam+'&&S.examDay<MAXDAY){ S.examDay++; S.todayLock=null; }
  else if(a==='reset'){ askConfirm('이 블록 초기화','이 블록의 모든 진도가 초기화되며 되돌릴 수 없습니다.', ()=>{
      const b=App.blocks.find(x=>x.id===App.active); b.state=freshState(b.schoolDays,b.lec); activateBlock(b.id); saveApp(); render();
    }, '초기화'); return; }
  saveApp(); render();
});
/* ===== 탭 잉크 필 =====
   활성 탭의 위치·크기를 그대로 따라가는 단일 인디케이터. 탭마다 배경을 칠하는 대신
   하나의 필이 미끄러지므로 "어디서 어디로 옮겼는지"가 모션으로 남는다. */
function moveTabInk(){
  const wrap=document.querySelector('.tabs'); if(!wrap) return;
  const ink=document.getElementById('tabInk'); const on=wrap.querySelector('.tab.on');
  if(!ink||!on) return;
  ink.style.width=on.offsetWidth+'px';
  ink.style.height=on.offsetHeight+'px';
  ink.style.transform=`translate(${on.offsetLeft}px, ${on.offsetTop}px)`;
  if(!ink.classList.contains('ready')){
    requestAnimationFrame(()=>{ ink.classList.add('ready'); wrap.classList.add('inkon'); });
  }
}
/* 새로 열린 패널에만 stagger를 걸고 곧바로 회수한다. 렌더 때마다 재생되면 산만해지므로
   .anim은 탭 전환 시점에서만 잠깐 붙였다 뗀다. */
function playPanelStagger(panel){
  if(!panel) return;
  panel.classList.remove('anim'); void panel.offsetWidth; panel.classList.add('anim');
  setTimeout(()=>panel.classList.remove('anim'), 900);
}
function activateTab(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panelset').forEach(x=>x.classList.remove('on'));
  const btn=document.querySelector(`.tab[data-tab="${name}"]`);
  const panel=document.getElementById('tab-'+name);
  if(btn) btn.classList.add('on');
  if(panel) panel.classList.add('on');
  moveTabInk();
  playPanelStagger(panel);
}
document.querySelectorAll('.tab').forEach(tb=>{
  tb.onclick=()=> activateTab(tb.dataset.tab);
});
window.addEventListener('resize', moveTabInk);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refreshApp(); });
(async ()=>{
  await loadApp();
  render();
  requestAnimationFrame(()=>{ moveTabInk(); playPanelStagger(document.querySelector('.panelset.on')); });
  startRealtimeSync();
  setupPullToRefresh();
})();
</script>
